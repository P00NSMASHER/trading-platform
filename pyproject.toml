[project]
name = "private-mnpi-surveillance-prototype"
version = "1.7.0"
description = "Historical market-surveillance research prototype"
requires-python = ">=3.11"
dependencies = [
  "joblib>=1.3",
  "numpy>=1.26",
  "exchange-calendars>=4.13,<5",
  "pandas>=2.2,<3",
  "scikit-learn>=1.4,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
