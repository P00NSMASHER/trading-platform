name: G1 0095 generator validation
on:
  push:
    branches: [g1/public-batch-0095-worker-0-jnpr-pnra-main-074be58]
jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.lock -r requirements-dev.lock
      - run: python scripts/g1_batch_0095_patch.py
      - run: python scripts/g1_batch_0095_generate.py
