name: G1 public batch 0034
on:
  push:
    branches: [g1/public-batch-0034-flt-sbux]
permissions:
  contents: write
concurrency:
  group: g1-public-batch-0034
  cancel-in-progress: false
jobs:
  recover:
    if: github.repository == 'P00NSMASHER/trading-platform' && !contains(github.event.head_commit.message, '[g1-generated]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade 'pip==26.2.1'
          python -m pip install -r requirements.lock -r requirements-dev.lock
      - name: Recover FleetCor and Starbucks and rebuild canonical receipts
        run: |
          python - <<'PY'
          import ast, copy, csv, hashlib, io, json, os, re, subprocess
          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo
          import g1_source_research as research
          import g1_acquisition_manifest as acquisition
          import research_receipt_rebuild as rebuild
          import real_data_release_sprint as sprint

          root = Path.cwd()
          base = '67419540d90b9bc136b9b226201fc9c70670327d'
          def load(path):
              return json.loads(Path(path).read_text())
          def save(path, obj):
              Path(path).write_text(json.dumps(obj, indent=2, sort_keys=True) + '\n')
          def sha(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          def rows(path):
              with Path(path).open(newline='', encoding='utf-8') as handle:
                  return list(csv.DictReader(handle))

          corpus = Path('data/processed/historical_events.csv')
          assert sha(corpus) == '43fb221eed14c2a00a0e9d4531fe365dd264128625877a6cfc986cf50f862f12'
          md = Path('data/processed/authorized_input_real')
          events = rows(corpus)
          old_exact = {r['event_id']: r for r in rows(md/'announcement_resolutions.csv') if r['resolution_status'] == 'resolved_exact_public_timestamp'}
          assert len(events) == 174 and len(old_exact) == 36
          exclusion_path = md/'g1_final_timing_exclusions.json'
          exclusions = load(exclusion_path)
          assert len(exclusions['exclusions']) == 138

          batch = Path('data/public/metadata/g1_announcement_times_batch_0034.csv')
          evidence_path = Path('data/public/metadata/g1_public_batch_0034_evidence.json')
          assert not batch.exists() and not evidence_path.exists()

          specs = [
              {
                  'event_id':'HEJFE-AF58BD8CAE4E8D1C','historical_symbol':'FLT',
                  'expected_trade':'2015-04-30 15:28:00','clock':'2015-04-30T16:01:00-04:00',
                  'publisher_timestamp_text':'Published on 04/30/2015 at 04:01 pm EDT',
                  'release_title':'FleetCor Reports First Quarter 2015 Financial Results',
                  'source_reference':'https://www.marketscreener.com/quote/stock/CORPAY-INC-6996903/news/FleetCor-Technologies-Reports-First-Quarter-2015-Financial-Results-20292810/',
                  'corroboration_reference':'https://www.sec.gov/Archives/edgar/data/1175454/000119312515161924/d919557dex991.htm',
                  'corroboration_basis':'SEC Exhibit 99.1 independently matches FleetCor, April 30 2015, first-quarter 2015 results, $416.2 million revenue and $1.00 diluted EPS. EDGAR acceptance and the 5:00pm conference-call time are not used.',
                  'expected_delta':1980,
              },
              {
                  'event_id':'HEJFE-A9DB7C5F6FD1D978','historical_symbol':'SBUX',
                  'expected_trade':'2015-01-22 13:22:00','clock':'2015-01-22T16:03:00-05:00',
                  'publisher_timestamp_text':'Published on 01/22/2015 at 04:03 pm EST',
                  'release_title':'Starbucks Delivers Record Q1 Revenue and EPS',
                  'source_reference':'https://www.marketscreener.com/quote/stock/STARBUCKS-CORPORATION-4905/news/Starbucks-Delivers-Record-Q1-Revenue-and-EPS-19748926/',
                  'corroboration_reference':'https://investor.starbucks.com/news/financial-releases/news-details/2015/Starbucks-Delivers-Record-Q1-Revenue-and-EPS/default.aspx',
                  'corroboration_basis':'Starbucks investor-relations copy independently matches the January 22 2015 Business Wire release, quarter ended December 28 2014, record $4.8 billion revenue and $1.30 GAAP EPS. No scheduled call time is used.',
                  'expected_delta':9660,
              },
          ]
          items = []
          hints_path = Path('data/public/metadata/g1_source_research_20260928.json')
          hints = load(hints_path)
          trial = copy.deepcopy(hints)

          for spec in specs:
              matches = [r for r in events if r['event_id'] == spec['event_id']]
              assert len(matches) == 1
              event = matches[0]
              assert event['historical_symbol'] == spec['historical_symbol']
              assert event['first_documented_illicit_trade_ts'] == spec['expected_trade']
              assert spec['event_id'] not in old_exact
              assert sum(r['event_id'] == spec['event_id'] for r in exclusions['exclusions']) == 1
              trade = datetime.fromisoformat(event['first_documented_illicit_trade_ts']).replace(tzinfo=ZoneInfo('America/New_York'))
              release = datetime.fromisoformat(spec['clock'])
              assert trade < release <= trade + timedelta(days=7)
              delta = int((release-trade).total_seconds())
              assert delta == spec['expected_delta']
              item = {
                  'event_id': spec['event_id'],
                  'historical_symbol': spec['historical_symbol'],
                  'event_date': trade.date().isoformat(),
                  'first_documented_illicit_trade_ts': event['first_documented_illicit_trade_ts'],
                  'public_announcement_ts': release.isoformat(),
                  'timestamp_kind': 'first_public_release',
                  'timestamp_evidence_kind': 'publisher_timestamp',
                  'source_family': 'preserved_wire_mirror',
                  'source_grade': 'B',
                  'publisher_timestamp_text': spec['publisher_timestamp_text'],
                  'release_title': spec['release_title'],
                  'source_reference': spec['source_reference'],
                  'corroboration_reference': spec['corroboration_reference'],
                  'corroboration_basis': spec['corroboration_basis'],
                  'reviewed_on': '2026-09-29',
                  'information_asymmetry_seconds': delta,
              }
              items.append(item)
              probe = dict(
                  item,
                  probe_id=f"{spec['historical_symbol']}-batch0034",
                  historical_event_match=True,
                  exact_clock_observed=True,
                  exact_public_release_ts=release.isoformat(),
                  evidence_eligible=True,
              )
              trial['validation_probes'].append(probe)

          research.validate_research_map(trial, exclusions)

          fields = ['event_id','historical_symbol','event_date','public_announcement_ts','timestamp_kind','source_grade','source_reference']
          output = io.StringIO(newline='')
          writer = csv.DictWriter(output, fieldnames=fields, lineterminator='\n')
          writer.writeheader()
          for item in items:
              writer.writerow({k:item[k] for k in fields})
          batch.write_text(output.getvalue(), encoding='utf-8')
          save(evidence_path, {
              'schema_version':'1',
              'research_use_only':True,
              'base_main_sha':base,
              'batch_path':str(batch),
              'batch_sha256':sha(batch),
              'items':items,
              'previous_exact_count':36,
              'expected_exact_count_after_batch':38,
              'expected_excluded_after_batch':136,
              'previous_exact_timestamps':{k:r['public_announcement_ts'] for k,r in old_exact.items()},
              'evidence_method':'Preserved Business Wire publication clocks with independent issuer/SEC corroboration. CI checks event identity, chronology, normalization and deterministic receipts; conference-call and EDGAR acceptance times are explicitly excluded.',
              'prohibited_substitutes':['edgar_acceptance_time','scheduled_call_time','archive_capture_time','inferred_clock','date_only'],
          })

          resolved_ids = {x['event_id'] for x in items}
          exclusions['exclusions'] = [r for r in exclusions['exclusions'] if r['event_id'] not in resolved_ids]
          exclusions['base_main_sha'] = base
          exclusions['g1_state'].update(
              exact_resolved=38,
              reviewed_excluded=136,
              raw_exact_time_evidence_gaps=136,
              exact_timing_analysis_eligible=38,
          )
          save(exclusion_path, exclusions)

          contract_path = Path('config/metadata_sources.public_progress.json')
          contract = load(contract_path)
          contract['sources'].insert(0, {
              'source_id':'public-businesswire-preserved-flt-sbux-batch-0034',
              'record_kind':'announcement_timestamp',
              'source_family':'official_newswire_archive',
              'path':str(batch),
              'enabled':True,
              'authorized':True,
              'data_classification':'public_official_data',
              'delimiter':',',
              'encoding':'utf-8',
              'timezone':'America/New_York',
              'column_map':{k:k for k in fields},
              'license_reference':'Public preserved Business Wire publication metadata on MarketScreener, independently corroborated by FleetCor SEC Exhibit 99.1 and Starbucks investor-relations release. No licensed vendor data used.',
              'notes':'FleetCor 2015-04-30 16:01 EDT and Starbucks 2015-01-22 16:03 EST. Neither conference-call times nor EDGAR acceptance timestamps are used.',
          })
          contract['reviewed_announcement_exclusions'].update(
              expected_count=136,
              expected_sha256=sha(exclusion_path),
          )
          contract['purpose'] = 'Cumulative public point-in-time metadata: G1 has 38 exact release timestamps and 136 reviewed fail-closed exclusions; exact-timing and all independent non-synthetic release locks remain fail-closed.'
          save(contract_path, contract)

          hints['base_main_sha'] = base
          hints['current_g1_state'].update(
              public_exact_batch_count=34,
              exact_resolved_event_records=38,
              reviewed_excluded_event_records=136,
              note='The repository is at batch_0034; cumulative exact event records are 38 because some public batches resolve more than one historical event.',
          )
          for item in items:
              probe = dict(
                  item,
                  probe_id=f"{item['historical_symbol']}-batch0034",
                  historical_event_match=True,
                  exact_clock_observed=True,
                  exact_public_release_ts=item['public_announcement_ts'],
                  evidence_eligible=False,
                  disposition='RESOLVED_IN_BATCH_0034',
                  reason='Promoted through separately reviewed preserved Business Wire evidence with independent issuer/SEC corroboration. This research hint cannot resolve events by itself.',
              )
              hints['validation_probes'].append(probe)
          save(hints_path, hints)

          assert rebuild.rebuild(root, publish=True)['after']['up_to_date']

          fresh = rows(md/'announcement_resolutions.csv')
          by_id = {r['event_id']:r for r in fresh}
          assert len(by_id) == 174
          for old_id, old in old_exact.items():
              assert by_id[old_id] == old, 'Existing exact evidence must remain unchanged'
          expected_utc = {
              'HEJFE-AF58BD8CAE4E8D1C':'2015-04-30T20:01:00Z',
              'HEJFE-A9DB7C5F6FD1D978':'2015-01-22T21:03:00Z',
          }
          for item in items:
              row = by_id[item['event_id']]
              assert row['resolution_status'] == 'resolved_exact_public_timestamp'
              assert row['public_announcement_ts'] == expected_utc[item['event_id']]
              assert row['source_grade'] == 'B'
              assert int(row['information_asymmetry_seconds']) == item['information_asymmetry_seconds']
          excluded = [r for r in fresh if r['resolution_status'] == 'excluded_fail_closed']
          assert len(excluded) == 136
          assert all(not r['public_announcement_ts'] and not r['information_asymmetry_seconds'] for r in excluded)

          ready = load(md/'metadata_readiness_summary.json')
          assert ready['announcement_exact_resolved'] == 38
          assert ready['announcement_events_excluded'] == 136
          assert ready['ready_g1_exact_timing_analysis'] is False
          assert ready['ready_for_non_synthetic_model_evaluation_metadata'] is False

          acquisition_path = Path('data/public/metadata/g1_acquisition_manifest.json')
          acquisition_path.write_text(acquisition.render_manifest(acquisition.build_manifest()), encoding='utf-8')
          sd = Path('data/processed/real_data_release_sprint')
          cp = Path('data/processed/coverage_plan_real/coverage_summary.json')
          sprint.refresh_coverage(
              coverage_summary_path=cp,
              metadata_readiness_path=md/'metadata_readiness_summary.json',
              metadata_quality_path=md/'metadata_quality_summary.json',
              requirements_manifest_path=sd/'requirements_manifest.json',
              unresolved_gates_path=cp.parent/'unresolved_gates.csv',
          )
          status = sprint.build_status(
              requirements_manifest_path=sd/'requirements_manifest.json',
              coverage_summary_path=cp,
              metadata_readiness_path=md/'metadata_readiness_summary.json',
              metadata_quality_path=md/'metadata_quality_summary.json',
              outpath=sd/'step_status.json',
          )
          step9 = next(r for r in status['steps'] if r['step']==9)
          assert step9['status'] == 'SOURCE_BLOCKED'
          assert '38/174' in step9['evidence'] and '136' in step9['evidence']
          assert not status['all_12_genuinely_complete']

          for filename in ['tests/test_g1_source_research.py','tests/test_g1_acquisition_manifest.py']:
              p=Path(filename); txt=p.read_text()
              txt=re.sub(r'== 36\b','== 38',txt)
              txt=re.sub(r'== 138\b','== 136',txt)
              if filename.endswith('test_g1_source_research.py'):
                  txt=txt.replace('state["public_exact_batch_count"] == 33','state["public_exact_batch_count"] == 34')
              ast.parse(txt); p.write_text(txt)

          p=Path('tests/test_real_data_release_sprint.py')
          txt=p.read_text().replace('updated["missing_exact_announcement_timestamps"] == 138','updated["missing_exact_announcement_timestamps"] == 136')
          ast.parse(txt); p.write_text(txt)

          p=Path('tests/test_g1_public_batch_0032.py')
          txt=p.read_text()
          txt=txt.replace('== (36,138)', '== (38,136)')
          txt=txt.replace('len(excluded)==138', 'len(excluded)==136')
          txt=txt.replace('"36/174" in step9["evidence"] and "138" in step9["evidence"]', '"38/174" in step9["evidence"] and "136" in step9["evidence"]')
          ast.parse(txt); p.write_text(txt)

          p=Path('docs/g1_announcement_times.md')
          txt=p.read_text().replace('33 public exact-time batches / 36 exact-resolved','34 public exact-time batches / 38 exact-resolved')
          txt += '\n### Batch 0034: FleetCor + Starbucks preserved Business Wire clocks\n\nFleetCor is recovered at 2015-04-30 16:01 EDT (20:01 UTC) from a preserved Business Wire publication timestamp, corroborated by SEC Exhibit 99.1. Starbucks is recovered at 2015-01-22 16:03 EST (21:03 UTC) from a preserved Business Wire publication timestamp, corroborated by the Starbucks investor-relations release. These clocks are 1,980 and 9,660 seconds after the frozen first trades respectively. The batch advances G1 from 36 exact / 138 reviewed exclusions to 38 exact / 136 reviewed exclusions. Conference-call times, EDGAR acceptance times, archive capture times and inferred AMC clocks remain prohibited substitutes. Step 9 remains SOURCE_BLOCKED.\n'
          p.write_text(txt)

          test_path=Path('tests/test_g1_public_batch_0034.py')
          test_source='''from __future__ import annotations
import csv
import hashlib
import json
from datetime import datetime, timedelta
from pathlib import Path
from zoneinfo import ZoneInfo
ROOT=Path(__file__).resolve().parents[1]
def read_rows(path):
    with path.open(newline="",encoding="utf-8") as handle:
        return list(csv.DictReader(handle))
def test_batch_0034_exact_clocks_and_event_match():
    dossier=json.loads((ROOT/"data/public/metadata/g1_public_batch_0034_evidence.json").read_text())
    events={r["event_id"]:r for r in read_rows(ROOT/"data/processed/historical_events.csv")}
    resolved={r["event_id"]:r for r in read_rows(ROOT/"data/processed/authorized_input_real/announcement_resolutions.csv")}
    expected={
        "HEJFE-AF58BD8CAE4E8D1C":("FLT","2015-04-30T20:01:00Z",1980,"04:01 pm EDT"),
        "HEJFE-A9DB7C5F6FD1D978":("SBUX","2015-01-22T21:03:00Z",9660,"04:03 pm EST"),
    }
    assert len(dossier["items"])==2
    for item in dossier["items"]:
        symbol,utc,delta,clock=expected[item["event_id"]]
        event=events[item["event_id"]]
        trade=datetime.fromisoformat(event["first_documented_illicit_trade_ts"]).replace(tzinfo=ZoneInfo("America/New_York"))
        release=datetime.fromisoformat(item["public_announcement_ts"])
        assert event["historical_symbol"]==symbol
        assert trade < release <= trade + timedelta(days=7)
        assert int((release-trade).total_seconds())==delta
        assert resolved[item["event_id"]]["public_announcement_ts"]==utc
        assert resolved[item["event_id"]]["resolution_status"]=="resolved_exact_public_timestamp"
        assert resolved[item["event_id"]]["source_grade"]=="B"
        assert clock in item["publisher_timestamp_text"]
        assert item["source_family"]=="preserved_wire_mirror"
        assert item["corroboration_reference"].startswith("https://")
def test_batch_0034_hash_prior_evidence_and_fail_closed_remainder():
    dossier=json.loads((ROOT/"data/public/metadata/g1_public_batch_0034_evidence.json").read_text())
    assert hashlib.sha256((ROOT/dossier["batch_path"]).read_bytes()).hexdigest()==dossier["batch_sha256"]
    by_id={r["event_id"]:r for r in read_rows(ROOT/"data/processed/authorized_input_real/announcement_resolutions.csv")}
    assert len(by_id)==174
    for eid,timestamp in dossier["previous_exact_timestamps"].items():
        assert by_id[eid]["public_announcement_ts"]==timestamp
        assert by_id[eid]["resolution_status"]=="resolved_exact_public_timestamp"
    excluded=[r for r in by_id.values() if r["resolution_status"]=="excluded_fail_closed"]
    assert len(excluded)==136
    assert all(not r["public_announcement_ts"] and not r["information_asymmetry_seconds"] for r in excluded)
'''
          ast.parse(test_source); test_path.write_text(test_source)

          assert rebuild.rebuild(root, publish=False)['before']['up_to_date']

          changed=set(subprocess.check_output(['git','diff','--name-only',base],text=True).splitlines())
          changed.update([str(batch),str(evidence_path),str(test_path)])
          permitted={
              '.github/workflows/g1-public-batch-0034.yml',
              str(contract_path),str(exclusion_path),str(hints_path),str(acquisition_path),
              str(batch),str(evidence_path),str(test_path),
              'docs/g1_announcement_times.md',
              'tests/test_g1_source_research.py','tests/test_g1_acquisition_manifest.py',
              'tests/test_real_data_release_sprint.py','tests/test_g1_public_batch_0032.py',
              str(cp),str(cp.parent/'unresolved_gates.csv'),str(sd/'step_status.json'),
              'data/processed/research_receipt_bundle.json',
              'data/processed/real_data_replay/real_data_replay_status.json',
          } | {str(md/name) for name in rebuild.METADATA_RECEIPTS}
          assert changed <= permitted, 'Unexpected changes: '+str(changed-permitted)

          allowpath=Path('config/release_drift_allowlist.json')
          allow=load(allowpath)
          reason='G1 FleetCor + Starbucks preserved Business Wire batch 0034; deterministic 38 exact / 136 reviewed exclusions with independent issuer/SEC corroboration and all remaining release gates unchanged.'
          for name in sorted(changed):
              section='intentional_release_modifications' if name in allow['intentional_release_modifications'] else 'repository_additions'
              allow[section][name]={'expected_sha256':sha(name),'reason':reason}
          save(allowpath,allow)
          changed.add(str(allowpath))

          subprocess.run(['git','add','--',*sorted(changed)],check=True)
          audit=Path('private_runtime/audit/g1-batch-0034');audit.mkdir(parents=True,exist_ok=True)
          save(audit/'verification.json',{
              'base_main_sha':base,
              'source_head_sha':os.environ['GITHUB_SHA'],
              'exact':38,'reviewed_excluded':136,
              'previous_exact_preserved':36,
              'new_events':items,
              'step9':'SOURCE_BLOCKED',
              'evaluation_release_permitted':False,
              'deterministic_rebuild_matches':True,
              'tracked_change_sha256':{name:sha(name) for name in sorted(changed)},
          })
          print(json.dumps({'exact':38,'reviewed_excluded':136,'new_events':[x['event_id'] for x in items],'step9':'SOURCE_BLOCKED'},indent=2))
          PY
      - name: Harden ephemeral runtime permissions
        run: python -m deployment_hardening harden-permissions --config config/runtime.demo.toml
      - name: Test generated candidate
        run: |
          python scripts/secret_scan.py --root .
          python -m pytest -q --junitxml=private_runtime/audit/g1-batch-0034/all-tests.xml
          python -m research_receipt_rebuild --check
      - name: Publish generated candidate to feature branch only
        run: |
          test "$GITHUB_REF_NAME" = 'g1/public-batch-0034-flt-sbux'
          test "$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'G1: recover FleetCor and Starbucks wire clocks, 38 exact / 136 excluded [g1-generated]'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          git rev-parse HEAD > private_runtime/audit/g1-batch-0034/generated-commit.txt
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: g1-public-batch-0034-${{ github.sha }}
          path: private_runtime/audit/g1-batch-0034
          if-no-files-found: warn
          retention-days: 30
