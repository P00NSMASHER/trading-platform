name: g1-public-corpus-scan

on:
  push:
    branches:
      - research/g1-public-corpus-scan
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scan public HEJFE release archive
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Scan public replication press-release archives
        run: >-
          python scripts/g1_scan_public_replication.py
          --events data/processed/historical_events.csv
          --outdir private_runtime/g1-public-scan

      - name: Upload G1 scan evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: g1-public-replication-${{ github.sha }}
          path: private_runtime/g1-public-scan
          if-no-files-found: error
          retention-days: 30
