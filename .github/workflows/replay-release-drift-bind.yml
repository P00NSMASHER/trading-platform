name: replay-release-drift-bind

on:
  push:
    branches: [release/source-agnostic-real-data-replay]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bind:
    if: "!contains(github.event.head_commit.message, '[replay-drift-generated]')"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - name: Bind exact addition hashes
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          p=Path("config/release_drift_allowlist.json")
          obj=json.loads(p.read_text(encoding="utf-8"))
          reason=(
            "Provider-agnostic real-data replay: one-command coverage/metadata/backfill/"
            "feature/control/release orchestration with fail-closed real-data gates."
          )
          paths=[
            "src/real_data_replay.py",
            "tests/test_real_data_replay.py",
            "config/real_data_replay.example.json",
            "docs/real_data_replay.md",
          ]
          def sha(path):
              h=hashlib.sha256()
              with Path(path).open("rb") as f:
                  for chunk in iter(lambda:f.read(1024*1024),b""):
                      h.update(chunk)
              return h.hexdigest()
          adds=obj["repository_additions"]
          mods=obj["intentional_release_modifications"]
          for path in paths:
              detail={"expected_sha256":sha(path),"reason":reason}
              mods.pop(path,None)
              adds[path]=detail
          p.write_text(json.dumps(obj,indent=2)+"\n",encoding="utf-8")
          PY
      - name: Verify release drift
        env:
          PYTHONPATH: src
        run: |
          python -m pip install "pytest==9.0.2"
          python -m pytest -q tests/test_release_drift.py
      - name: Commit binding
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/release_drift_allowlist.json
          git commit -m "[replay-drift-generated] bind real-data replay additions"
          git push origin HEAD:release/source-agnostic-real-data-replay
