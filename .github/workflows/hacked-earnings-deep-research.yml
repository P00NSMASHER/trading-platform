name: Hacked earnings deeper public-source research

on:
  push:
    branches:
      - research/hacked-earnings-deep-extraction-20261005
    paths:
      - scripts/hacked_earnings_deep_research.py
      - .github/workflows/hacked-earnings-deep-research.yml

permissions:
  contents: read

concurrency:
  group: hacked-earnings-deep-research
  cancel-in-progress: false

jobs:
  research:
    if: github.ref == 'refs/heads/research/hacked-earnings-deep-extraction-20261005'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      NLTK_DATA: /tmp/hacked-earnings-nltk
    steps:
      - name: Checkout exact research commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Set up isolated research Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Validate parser and research safeguards
        run: python scripts/hacked_earnings_deep_research.py --self-test
      - name: Install research-only binary readers and tokenizer
        run: |
          python -m pip install --disable-pip-version-check 'numpy==1.26.4' 'pyarrow==17.0.0' 'nltk==3.9.1'
          python -m nltk.downloader -d "$NLTK_DATA" stopwords
          mkdir -p data/processed/hacked_earnings_deep
          python -m pip freeze > data/processed/hacked_earnings_deep/requirements-runtime.txt
      - name: Verify source hashes and extract all six archives
        run: |
          python scripts/hacked_earnings_deep_research.py --download
          cat data/processed/hacked_earnings_deep/REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save derived research only to the unchanged feature branch
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          RESEARCH_BRANCH: research/hacked-earnings-deep-extraction-20261005
        run: |
          set -euo pipefail
          git fetch origin "$RESEARCH_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/processed/hacked_earnings_deep
          if ! git diff --cached --quiet; then
            git commit -m 'Record pinned-source deeper text research results; no canonical coverage credit'
            git push origin "HEAD:refs/heads/$RESEARCH_BRANCH"
          fi
      - name: Preserve derived research artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hacked-earnings-deep-${{ github.sha }}
          path: data/processed/hacked_earnings_deep
          if-no-files-found: warn
          retention-days: 1
