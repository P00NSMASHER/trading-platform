name: g4-shares-batch-0008-final

on:
  push:
    branches: [fix/g4-shares-batch-0008-final]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: g4-shares-batch-0008-final
  cancel-in-progress: true

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[g4-batch-0008-integrated]')"
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: src

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade "pip==26.2.1"
          python -m pip install -r requirements.lock
          python -m pip install -r requirements-dev.lock

      - name: Materialize observations 3501-3828
        run: |
          python -m g4_materialize_batch \
            --requirements data/processed/coverage_plan_real/symbol_date_requirements.csv \
            --anchors data/public/metadata/g4_shares_anchors_batch_0008.csv \
            --start 3500 --count 328 \
            --output data/public/metadata/g4_shares_batch_0008.csv \
            --report data/processed/authorized_input_real/g4_shares_batch_0008_report.json

      - name: Require all 328 resolved under strict rules
        run: |
          python - <<'PY'
          import csv, json
          from datetime import date, datetime
          from pathlib import Path

          rows=list(csv.DictReader(Path("data/public/metadata/g4_shares_batch_0008.csv").open(newline="",encoding="utf-8")))
          r=json.loads(Path("data/processed/authorized_input_real/g4_shares_batch_0008_report.json").read_text())

          assert len(rows)==328, len(rows)
          assert [int(x["observation_index"]) for x in rows] == list(range(3501,3829))
          assert r["resolved_count"] == 328 and r["unresolved_count"] == 0, r
          assert r["max_staleness_days"] == 130
          assert r["future_filed_facts_prohibited"] is True

          for row in rows:
              assert row["status"] == "RESOLVED", row
              assert 0 <= int(row["staleness_days"]) <= 130, row
              assert date.fromisoformat(row["fact_date"]) <= date.fromisoformat(row["target_trade_date"]), row
              assert date.fromisoformat(row["filed_date"]) <= date.fromisoformat(row["target_trade_date"]), row
              assert datetime.fromisoformat(row["available_at"]) <= datetime.fromisoformat(row["target_cutoff_local"]), row
              assert int(row["shares_outstanding"]) > 0, row
          PY

      - name: Register batch 0008 source
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p=Path("config/metadata_sources.public_progress.json")
          obj=json.loads(p.read_text())
          source_id="public-sec-shares-batch-0008"
          obj["purpose"]="Cumulative public point-in-time metadata progress: G3 complete plus strict G4 batches 0001-0005, 0007, and 0008; hard 130-day shares staleness enforced."
          obj["sources"]=[s for s in obj["sources"] if s.get("source_id") != source_id]
          obj["sources"].append({
              "source_id": source_id,
              "record_kind": "shares_outstanding",
              "source_family": "sec_xbrl_companyfacts",
              "path": "data/public/metadata/g4_shares_batch_0008.csv",
              "enabled": True,
              "authorized": True,
              "data_classification": "public_official_data",
              "license_reference": "SEC public filings / evidence frozen in batch-0008 anchors",
              "delimiter": ",",
              "encoding": "utf-8",
              "timezone": "America/New_York",
              "column_map": {
                  "historical_symbol": "historical_symbol",
                  "target_trade_date": "target_trade_date",
                  "fact_date": "fact_date",
                  "available_at": "available_at",
                  "shares_outstanding": "shares_outstanding",
                  "source_reference": "source_reference"
              }
          })
          p.write_text(json.dumps(obj,indent=2)+"\n",encoding="utf-8")
          PY

      - name: Rebuild canonical metadata
        run: |
          python -m metadata_resolver \
            --events data/processed/historical_events.csv \
            --symbol-dates data/processed/coverage_plan_real/symbol_date_requirements.csv \
            --contract config/metadata_sources.public_progress.json \
            --outdir data/processed/authorized_input_real

          python -m metadata_quality \
            --events data/processed/historical_events.csv \
            --symbol-dates data/processed/coverage_plan_real/symbol_date_requirements.csv \
            --contract config/metadata_sources.public_progress.json \
            --resolver-dir data/processed/authorized_input_real \
            --outdir data/processed/authorized_input_real

      - name: Assert cumulative strict readiness
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path

          ready=json.loads(Path("data/processed/authorized_input_real/metadata_readiness_summary.json").read_text())
          quality=json.loads(Path("data/processed/authorized_input_real/metadata_quality_summary.json").read_text())
          domains=list(csv.DictReader(Path("data/processed/authorized_input_real/metadata_domain_quality.csv").open()))

          assert ready["ready_g3_primary_listing_history"] is True, ready
          assert ready["event_exchange_resolved"] == 174, ready
          assert ready["shares_symbol_dates_resolved"] == 3317, ready
          assert ready["shares_symbol_dates_unresolved"] == 511, ready
          assert ready["ready_g4_shares_outstanding"] is False, ready

          shares=next(x for x in domains if x["domain"]=="shares")
          assert int(shares["resolver_ready_count"]) == 3317, shares
          assert int(shares["quality_clear_count"]) == 3317, shares
          assert int(shares["quarantined_count"]) == 0, shares
          assert quality["quarantined_share_symbol_dates"] == 0, quality
          print(json.dumps({"g3":174,"g4_resolved":3317,"g4_remaining":511,"quarantined":0},indent=2))
          PY

      - name: Refresh reviewed release-drift hashes
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          reason="G4 batch 0008: reviewed public point-in-time shares evidence for observations 3501-3828 under the hard 130-day staleness limit and cumulative readiness/quality receipts"
          paths=[
              "data/processed/authorized_input_real/metadata_quality_summary.json",
              "data/processed/authorized_input_real/metadata_readiness_summary.json",
              "data/processed/authorized_input_real/metadata_domain_quality.csv",
              "data/processed/authorized_input_real/metadata_quality_issues.csv",
              "data/processed/authorized_input_real/metadata_source_inventory.json",
              "data/processed/authorized_input_real/metadata_unresolved_gates.csv",
              "data/processed/authorized_input_real/shares_outstanding_resolutions.csv",
              "config/metadata_sources.public_progress.json",
              "data/processed/authorized_input_real/g4_shares_batch_0008_report.json",
              "data/public/metadata/g4_shares_anchors_batch_0008.csv",
              "data/public/metadata/g4_shares_batch_0008.csv",
          ]

          allow_path=Path("config/release_drift_allowlist.json")
          allow=json.loads(allow_path.read_text())
          mods=allow["intentional_release_modifications"]
          adds=allow["repository_additions"]

          for name in paths:
              p=Path(name)
              digest=hashlib.sha256(p.read_bytes()).hexdigest()
              rec={"expected_sha256":digest,"reason":reason}
              if name in mods:
                  mods[name]=rec
              else:
                  adds[name]=rec

          allow_path.write_text(json.dumps(allow,indent=2)+"\n",encoding="utf-8")
          PY

      - name: Remove temporary generation workflow
        run: git rm -f .github/workflows/g4-shares-batch-0008-final.yml

      - name: Stage reviewed integration tree
        run: git add -A

      - name: Harden ephemeral runtime permissions
        run: python -m deployment_hardening harden-permissions --config config/runtime.demo.toml

      - name: Full test suite
        run: python -m pytest -q

      - name: Commit integrated batch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "[g4-batch-0008-integrated] register observations 3501-3828"
          git push origin HEAD:fix/g4-shares-batch-0008-final
