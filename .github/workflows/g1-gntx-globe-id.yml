name: G1 GNTX GlobeNewswire legacy IDs
on:
  push:
    branches: [g1/research-gntx-globe-id]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Probe migrated Marketwired IDs
        run: |
          python - <<'PY'
          import urllib.request,re,html
          ua={"User-Agent":"Mozilla/5.0"}
          slug="Gentex-Reports-Third-Quarter-2013-Financial-Results.html"
          for n in range(930754,930766):
            urls=[
              f"https://www.globenewswire.com/news-release/2013/10/22/{n}/0/en/{slug}",
              f"https://www.globenewswire.com/news-release/2013/10/22/{n}/0/en/Gentex-Reports-Third-Quarter-2013-Financial-Results.html",
            ]
            for url in urls[:1]:
              try:
                req=urllib.request.Request(url,headers=ua)
                with urllib.request.urlopen(req,timeout=8) as r:
                  raw=r.read().decode("utf-8","replace")
                  plain=html.unescape(re.sub(r"<[^>]+>"," ",raw));plain=re.sub(r"\s+"," ",plain)
                  print("ID",n,"STATUS",r.status,"FINAL",r.url,"LEN",len(raw),"TITLEPOS",plain.lower().find("gentex reports third quarter 2013 financial results"))
                  if "Gentex" in plain:
                    for pat in [r'October 22, 2013\s+\d{2}:\d{2}\s+ET',r'Oct(?:ober)?\.? 22, 2013.{0,100}?\d{1,2}:\d{2}.{0,20}?ET']:
                      print("CLOCKS",n,re.findall(pat,plain,re.I))
                    i=plain.lower().find("gentex reports third quarter 2013 financial results")
                    if i>=0: print("CONTEXT",plain[max(0,i-500):i+1000])
              except Exception as e: print("ID",n,"ERR",repr(e))
          PY
