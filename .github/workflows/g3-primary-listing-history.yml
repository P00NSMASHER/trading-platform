name: g3-primary-listing-history

on:
  push:
    branches:
      - fix/g3-primary-listing-history
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-g3:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Build pinned public G3 evidence
        env:
          PYTHONPATH: src
        run: |
          python -m g3_listing_evidence \
            --events data/processed/historical_events.csv \
            --supplement data/public/metadata/g3_listing_supplement.csv \
            --output data/public/metadata/g3_primary_listing_history.csv \
            --report data/processed/authorized_input_real/g3_listing_evidence_report.json

      - name: Resolve canonical metadata state
        env:
          PYTHONPATH: src
        run: |
          python -m metadata_resolver \
            --events data/processed/historical_events.csv \
            --symbol-dates data/processed/coverage_plan_real/symbol_date_requirements.csv \
            --contract config/metadata_sources.g3_public.json \
            --outdir data/processed/authorized_input_real

      - name: Audit metadata quality
        env:
          PYTHONPATH: src
        run: |
          python -m metadata_quality \
            --events data/processed/historical_events.csv \
            --symbol-dates data/processed/coverage_plan_real/symbol_date_requirements.csv \
            --contract config/metadata_sources.g3_public.json \
            --resolver-dir data/processed/authorized_input_real \
            --outdir data/processed/authorized_input_real

      - name: Assert G3 readiness only
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path

          root = Path(".")
          readiness = json.loads((root/"data/processed/authorized_input_real/metadata_readiness_summary.json").read_text())
          report = json.loads((root/"data/processed/authorized_input_real/g3_listing_evidence_report.json").read_text())
          quality = list(csv.DictReader((root/"data/processed/authorized_input_real/metadata_domain_quality.csv").open()))

          assert report["event_count"] == 174
          assert report["resolved_count"] == 174
          assert report["unresolved_count"] == 0
          assert report["conflict_count"] == 0
          assert report["g3_ready"] is True

          assert readiness["event_exchange_resolved"] == 174
          assert readiness["event_exchange_unresolved"] == 0
          assert readiness["ready_g3_primary_listing_history"] is True

          exchange = next(x for x in quality if x["domain"] == "exchange")
          assert exchange["required_count"] == "174"
          assert exchange["resolver_ready_count"] == "174"
          assert exchange["quarantined_count"] == "0"
          assert exchange["quality_score"] == "100.0"
          assert exchange["status"] == "QUALITY_CLEAR"

          assert readiness["ready_g1_announcement_times"] is False
          assert readiness["ready_g4_shares_outstanding"] is False
          assert readiness["ready_g5_matched_control_universe"] is False
          print(json.dumps({
              "g3_ready": True,
              "event_exchange_resolved": readiness["event_exchange_resolved"],
              "nasdaq_events": readiness["event_exchange_nasdaq"],
              "exchange_quality": exchange,
          }, indent=2))
          PY

      - name: Commit generated G3 evidence and canonical readiness
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/public/metadata/g3_primary_listing_history.csv \
            data/processed/authorized_input_real/g3_listing_evidence_report.json \
            data/processed/authorized_input_real/metadata_readiness_summary.json \
            data/processed/authorized_input_real/metadata_source_inventory.json \
            data/processed/authorized_input_real/metadata_unresolved_gates.csv \
            data/processed/authorized_input_real/event_exchange_resolutions.csv \
            data/processed/authorized_input_real/announcement_resolutions.csv \
            data/processed/authorized_input_real/shares_outstanding_resolutions.csv \
            data/processed/authorized_input_real/control_universe_readiness.csv \
            data/processed/authorized_input_real/metadata_quality_summary.json \
            data/processed/authorized_input_real/metadata_domain_quality.csv \
            data/processed/authorized_input_real/metadata_quality_issues.csv \
            data/processed/authorized_input_real/metadata_quarantine.csv \
            data/processed/authorized_input_real/metadata_quality_gate.csv
          git commit -m "[g3-generated] resolve all 174 primary listings"
          git push origin HEAD:fix/g3-primary-listing-history
