name: Retire completed G1 importer
on:
  push:
    branches: [g1/public-batch-0033-nvr]
permissions:
  contents: write
concurrency:
  group: g1-public-batch-0033
  cancel-in-progress: false
jobs:
  retire:
    if: github.repository == 'P00NSMASHER/trading-platform' && !contains(github.event.head_commit.message, '[g1-generated]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade 'pip==26.2.1'
          python -m pip install -r requirements.lock -r requirements-dev.lock
      - name: Remove only the completed importer and its drift entry
        run: |
          python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          p = Path('data/processed/authorized_input_real/metadata_readiness_summary.json')
          readiness = json.loads(p.read_text())
          assert (readiness['announcement_exact_resolved'], readiness['announcement_events_excluded']) == (36,138)
          assert readiness['ready_g1_exact_timing_analysis'] is False
          before = {str(x):hashlib.sha256(x.read_bytes()).hexdigest() for x in Path('data').rglob('*') if x.is_file()}
          workflow = '.github/workflows/g1-public-batch-0033.yml'
          allowpath = Path('config/release_drift_allowlist.json')
          allow = json.loads(allowpath.read_text())
          assert workflow in allow['repository_additions']
          del allow['repository_additions'][workflow]
          allowpath.write_text(json.dumps(allow, indent=2, sort_keys=True) + '\n')
          subprocess.run(['git','rm','--',workflow], check=True)
          subprocess.run(['git','add','--',str(allowpath)], check=True)
          changed = set(subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines())
          assert changed == {workflow,str(allowpath)}
          assert before == {str(x):hashlib.sha256(x.read_bytes()).hexdigest() for x in Path('data').rglob('*') if x.is_file()}
          print('Only completed generator and its drift entry removed. All data bytes unchanged; 36 exact / 138 excluded; Step 9 remains blocked.')
          PY
      - name: Harden ephemeral runtime permissions
        run: python -m deployment_hardening harden-permissions --config config/runtime.demo.toml
      - name: Verify clean candidate with full tests and unchanged audit policy
        run: |
          mkdir -p private_runtime/audit/g1-batch-0033-final
          python scripts/secret_scan.py --root .
          python -m pytest -q --junitxml=private_runtime/audit/g1-batch-0033-final/all-tests.xml
          python -m research_receipt_rebuild --check
          python -m pytest -q tests/test_control_plane_adversarial.py --junitxml=private_runtime/audit/g1-batch-0033-final/adversarial-junit.xml
          python scripts/control_plane_audit_pack.py --root . --junit-xml private_runtime/audit/g1-batch-0033-final/adversarial-junit.xml --output-dir private_runtime/audit/g1-batch-0033-final --expected-champion-sha256 0c8c16c9be734152c0018aa40e576fe4db9f4621359fafe521465890f9945616
      - name: Publish cleaned candidate to this branch only
        run: |
          test "$GITHUB_REF_NAME" = 'g1/public-batch-0033-nvr'
          test "$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)" = "$GITHUB_SHA"
          git diff --exit-code
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Retire completed NVR generator; preserve verified 36/138 data [g1-generated]'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          git rev-parse HEAD > private_runtime/audit/g1-batch-0033-final/generated-commit.txt
          git rev-parse 'HEAD^{tree}' > private_runtime/audit/g1-batch-0033-final/generated-tree.txt
      - name: Retain final candidate verification
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: g1-public-batch-0033-final-${{ github.sha }}
          path: private_runtime/audit/g1-batch-0033-final
          if-no-files-found: warn
          retention-days: 30
