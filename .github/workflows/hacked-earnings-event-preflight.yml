name: Hacked earnings event outcome preflight

on:
  push:
    branches:
      - research/hacked-earnings-oos-experiment-20261006
    paths:
      - scripts/hacked_earnings_event_outcome_preflight.py
      - .github/workflows/hacked-earnings-event-preflight.yml

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      PYTHONPATH: src:scripts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - run: |
          python -m pip install "numpy==2.3.5" "pandas==2.2.3" "scipy==1.17.0" "scikit-learn==1.8.0" "yfinance==1.7.0"
          python scripts/hacked_earnings_event_outcome_preflight.py
      - name: Commit bounded preflight results
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          RESEARCH_BRANCH: research/hacked-earnings-oos-experiment-20261006
        run: |
          set -euo pipefail
          git fetch origin "$RESEARCH_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_HEAD"
          rm -f data/processed/hacked_earnings_oos_preflight/yahoo_daily_cache.csv.gz
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/processed/hacked_earnings_oos_preflight
          git commit -m 'Record event-only public outcome coverage preflight'
          git push origin "HEAD:refs/heads/$RESEARCH_BRANCH"
