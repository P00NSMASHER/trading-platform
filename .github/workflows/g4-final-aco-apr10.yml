name: g4-final-aco-apr10

on:
  push:
    branches: [fix/g4-final-aco-apr10]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: g4-final-aco-apr10
  cancel-in-progress: true

jobs:
  repair:
    if: "!contains(github.event.head_commit.message, '[g4-aco-apr10-integrated]')"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade "pip==26.2.1"
          python -m pip install -r requirements.lock
          python -m pip install -r requirements-dev.lock

      - name: Rebuild canonical metadata
        run: |
          python -m metadata_resolver \
            --events data/processed/historical_events.csv \
            --symbol-dates data/processed/coverage_plan_real/symbol_date_requirements.csv \
            --contract config/metadata_sources.public_progress.json \
            --outdir data/processed/authorized_input_real
          python -m metadata_quality \
            --events data/processed/historical_events.csv \
            --symbol-dates data/processed/coverage_plan_real/symbol_date_requirements.csv \
            --contract config/metadata_sources.public_progress.json \
            --resolver-dir data/processed/authorized_input_real \
            --outdir data/processed/authorized_input_real

      - name: Assert one-row ACO repair
        run: |
          python - <<'PY'
          import csv, json
          from collections import Counter
          from pathlib import Path

          out=Path("data/processed/authorized_input_real")
          r=json.loads((out/"metadata_readiness_summary.json").read_text())
          assert r["event_exchange_resolved"] == 174
          assert r["ready_g3_primary_listing_history"] is True
          assert r["shares_symbol_dates_resolved"] == 3810, r
          assert r["shares_symbol_dates_unresolved"] == 18, r
          assert r["ready_g4_shares_outstanding"] is False

          domains=list(csv.DictReader((out/"metadata_domain_quality.csv").open(newline="",encoding="utf-8")))
          shares=next(x for x in domains if x["domain"]=="shares")
          assert int(shares["resolver_ready_count"]) == 3810, shares
          assert int(shares["quality_clear_count"]) == 3810, shares
          assert int(shares["quarantined_count"]) == 0, shares

          rows=list(csv.DictReader((out/"shares_outstanding_resolutions.csv").open(newline="",encoding="utf-8")))
          aco=next(x for x in rows if x["historical_symbol"]=="ACO" and x["trade_date"]=="2013-04-10")
          assert aco["resolution_status"]=="resolved", aco
          assert aco["shares_outstanding"]=="32287200", aco
          assert aco["fact_date"]=="2013-03-27", aco
          assert aco["available_at"]=="2013-04-10T12:56:12-04:00", aco
          assert aco["source_id"]=="public-sec-shares-aco-20130410", aco

          unresolved=[x for x in rows if x["resolution_status"]=="unresolved"]
          counts=Counter(x["historical_symbol"] for x in unresolved)
          assert len(unresolved)==18, len(unresolved)
          assert counts == Counter({"ACO":10,"CGNX":5,"WLL":3}), counts

          q=out/"metadata_quarantine.csv"
          assert (not q.exists()) or q.read_text(encoding="utf-8").strip()==""
          print(json.dumps({"resolved":3810,"remaining":18,"unresolved_by_symbol":dict(counts),"aco_apr10":aco},indent=2))
          PY

      - name: Update reviewed drift hashes
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          p=Path("config/release_drift_allowlist.json")
          obj=json.loads(p.read_text(encoding="utf-8"))
          reason="G4 final ACO repair: exact SEC EDGAR acceptance 2013-04-10 12:56:12 precedes 14:10 cutoff; exact 32,287,200 shares fact as of 2013-03-27; one row closed without inference or staleness exception."
          paths=[
            "config/metadata_sources.public_progress.json",
            "data/processed/authorized_input_real/metadata_quality_summary.json",
            "data/processed/authorized_input_real/metadata_readiness_summary.json",
            "data/processed/authorized_input_real/metadata_domain_quality.csv",
            "data/processed/authorized_input_real/metadata_quality_issues.csv",
            "data/processed/authorized_input_real/metadata_source_inventory.json",
            "data/processed/authorized_input_real/metadata_unresolved_gates.csv",
            "data/processed/authorized_input_real/shares_outstanding_resolutions.csv",
            "data/public/metadata/g4_shares_aco_20130410.csv",
            "data/processed/authorized_input_real/g4_aco_20130410_evidence.json",
          ]
          def sha(path):
              h=hashlib.sha256()
              with Path(path).open("rb") as f:
                  for chunk in iter(lambda:f.read(1024*1024),b""):
                      h.update(chunk)
              return h.hexdigest()
          mods=obj["intentional_release_modifications"]
          adds=obj["repository_additions"]
          for path in paths:
              detail={"expected_sha256":sha(path),"reason":reason}
              if path in mods:
                  mods[path]=detail
              else:
                  adds[path]=detail
          p.write_text(json.dumps(obj,indent=2)+"\n",encoding="utf-8")
          PY

      - name: Focused tests
        run: |
          python -m pytest -q \
            tests/test_metadata_resolver.py \
            tests/test_metadata_quality.py

      - name: Commit canonical ACO repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            config/release_drift_allowlist.json \
            data/processed/authorized_input_real
          git commit -m "[g4-aco-apr10-integrated] exact SEC acceptance repair"
          git push origin HEAD:fix/g4-final-aco-apr10
