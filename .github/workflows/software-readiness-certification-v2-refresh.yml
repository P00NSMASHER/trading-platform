name: software-readiness-certification-v2-refresh

on:
  push:
    branches: [release/software-readiness-certification-v2]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: software-readiness-certification-v2-refresh
  cancel-in-progress: true

jobs:
  certify:
    if: "!contains(github.event.head_commit.message, '[software-cert-refresh-generated]')"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade "pip==26.2.1"
          python -m pip install -r requirements.lock
          python -m pip install -r requirements-dev.lock

      - name: Harden ephemeral runtime permissions
        run: |
          mkdir -p private_runtime/audit private_runtime/backups private_runtime/exports
          chmod 700 private_runtime/audit private_runtime/backups private_runtime/exports
          chmod 600 config/runtime.demo.toml
          chmod 600 data/processed/case_demo/cases.sqlite
          chmod 600 data/processed/model_demo/model_bundle.joblib
          chmod 600 data/processed/model_demo/training_manifest.json

      - name: Generate current certification
        run: |
          python src/software_readiness_certification.py --require-software-ready

      - name: Bind current hashes
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          p=Path("config/release_drift_allowlist.json")
          obj=json.loads(p.read_text(encoding="utf-8"))
          manifest=json.loads(Path("RELEASE_MANIFEST.json").read_text(encoding="utf-8"))
          release_paths={str(x["path"]) for x in manifest.get("files",[])}
          reason=(
              "Software-readiness certification: machine-readable separation of software readiness "
              "from real-data validation, backed by expanded hostile regression, dashboard security, "
              "and private-runtime integrity checks."
          )
          paths=[
              "src/software_readiness_certification.py",
              "tests/test_software_readiness_certification.py",
              "docs/software_readiness_certification.md",
              "data/processed/software_readiness/software_readiness_certification.json",
          ]
          def sha(path):
              h=hashlib.sha256()
              with Path(path).open("rb") as f:
                  for chunk in iter(lambda:f.read(1024*1024),b""):
                      h.update(chunk)
              return h.hexdigest()
          mods=obj["intentional_release_modifications"]
          adds=obj["repository_additions"]
          for path in paths:
              detail={"expected_sha256":sha(path),"reason":reason}
              mods.pop(path,None); adds.pop(path,None)
              if path in release_paths:
                  mods[path]=detail
              else:
                  adds[path]=detail
          p.write_text(json.dumps(obj,indent=2)+"\n",encoding="utf-8")
          PY

      - name: Commit refreshed certification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/release_drift_allowlist.json data/processed/software_readiness/software_readiness_certification.json
          git commit -m "[software-cert-refresh-generated] refresh certification receipt"
          git push origin HEAD:release/software-readiness-certification-v2
