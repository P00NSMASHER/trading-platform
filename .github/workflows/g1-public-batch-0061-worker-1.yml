name: G1 public batch 0061 worker 1
on:
  push:
    branches:
      - g1/public-batch--worker-1-0061-rh
permissions:
  contents: write
concurrency:
  group: g1-public-batch-0061-worker-1
  cancel-in-progress: false
jobs:
  recover:
    if: github.repository == 'P00NSMASHER/trading-platform' && !contains(github.event.head_commit.message, '[g1-generated]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade 'pip==26.2.1'
          python -m pip install -r requirements.lock -r requirements-dev.lock
      - name: Generate canonical G1 batch
        run: python scripts/g1_batch_0061_generate.py
      - name: Harden ephemeral runtime permissions
        run: python -m deployment_hardening harden-permissions --config config/runtime.demo.toml
      - name: Verify generated candidate
        run: |
          python scripts/secret_scan.py --root .
          python -m pytest -q --junitxml=private_runtime/audit/g1-batch-0061/all-tests.xml
          python -m research_receipt_rebuild --check
      - name: Publish generated feature candidate
        run: |
          test "$GITHUB_REF_NAME" = 'g1/public-batch--worker-1-0061-rh'
          test "$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'G1: recover RH clock, 80 exact / 94 excluded [g1-generated]'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: g1-public-batch-0061-worker1-${{ github.sha }}
          path: private_runtime/audit/g1-batch-0061
          if-no-files-found: warn
          retention-days: 30
