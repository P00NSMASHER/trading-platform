name: G1 swarm controller

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - closed
  issue_comment:
    types:
      - created
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: read

concurrency:
  group: g1-swarm-controller
  cancel-in-progress: false

jobs:
  coordinate:
    name: Reconcile G1 swarm state
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.number == 153 &&
       startsWith(github.event.comment.body, 'WORKER '))
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Reconcile token and queue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p private_runtime/g1-swarm
          python scripts/g1_swarm_controller.py \
            --apply \
            --repository "$GITHUB_REPOSITORY" \
            --controller-sha "$GITHUB_SHA" \
            | tee private_runtime/g1-swarm/controller-summary.json

      - name: Upload controller receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: g1-swarm-controller-${{ github.sha }}
          path: private_runtime/g1-swarm
          if-no-files-found: error
          retention-days: 14
