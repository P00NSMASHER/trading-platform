name: G1 swarm controller

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - closed
  schedule:
    - cron: "57 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: read

concurrency:
  group: g1-swarm-controller
  cancel-in-progress: false

jobs:
  coordinate:
    name: Reconcile G1 swarm state
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Reconcile token and queue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/g1_swarm_controller.py \
            --apply \
            --repository "$GITHUB_REPOSITORY" \
            --controller-sha "$GITHUB_SHA"
