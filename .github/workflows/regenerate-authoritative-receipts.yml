name: regenerate-authoritative-receipts

on:
  push:
    branches:
      - regen/authoritative-receipts-20260927

permissions:
  contents: write

concurrency:
  group: regenerate-authoritative-receipts
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      BASE_SHA: 3b68d59a58e3207f356406689ce4844d3a1d2202
      TARGET_BRANCH: regen/authoritative-receipts-20260927
    steps:
      - name: Checkout exact authoritative source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BASE_SHA }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade "pip==26.2.1"
          python -m pip install -r requirements.lock
          python -m pip install -r requirements-dev.lock

      - name: Harden ephemeral runtime
        run: python -m deployment_hardening harden-permissions --config config/runtime.demo.toml

      - name: Regenerate canonical metadata receipts
        run: |
          python src/metadata_resolver.py \
            --events data/processed/historical_events.csv \
            --symbol-dates data/processed/coverage_plan_real/symbol_date_requirements.csv \
            --contract config/metadata_sources.public_progress.json \
            --outdir data/processed/authorized_input_real

          python src/metadata_quality.py \
            --events data/processed/historical_events.csv \
            --symbol-dates data/processed/coverage_plan_real/symbol_date_requirements.csv \
            --contract config/metadata_sources.public_progress.json \
            --resolver-dir data/processed/authorized_input_real \
            --outdir data/processed/authorized_input_real

      - name: Regenerate replay receipt
        run: |
          python src/real_data_replay.py \
            --config config/real_data_replay.software_proof.json

      - name: Regenerate software certification
        run: |
          python src/software_readiness_certification.py \
            --require-software-ready

      - name: Verify regenerated state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          readiness=json.loads(Path("data/processed/authorized_input_real/metadata_readiness_summary.json").read_text())
          quality=json.loads(Path("data/processed/authorized_input_real/metadata_quality_summary.json").read_text())
          replay=json.loads(Path("data/processed/real_data_replay/real_data_replay_status.json").read_text())
          cert=json.loads(Path("data/processed/software_readiness/software_readiness_certification.json").read_text())

          assert readiness["announcement_exact_resolved"] == 1, readiness
          assert readiness["announcement_events_excluded"] == 173, readiness
          assert readiness["announcement_events_accounted_for"] == 174, readiness
          assert readiness["announcement_unresolved"] == 0, readiness
          assert quality["blocking_issue_count"] == 0, quality
          assert quality["reviewed_announcement_exclusion_count"] == 173, quality
          assert replay["stages"]["metadata"]["announcement_exact_resolved"] == 1, replay["stages"]["metadata"]
          assert replay["stages"]["metadata"]["announcement_required"] == 174, replay["stages"]["metadata"]
          assert cert["software_ready"] is True, cert
          assert cert["real_data_state"]["metadata"]["announcement_exact_resolved"] == 1, cert["real_data_state"]
          assert cert["real_data_state"]["metadata"]["announcement_required"] == 174, cert["real_data_state"]
          assert cert["overall_status"] == "SOFTWARE_READY_REAL_DATA_PENDING", cert["overall_status"]
          assert cert["git_commit"] == "3b68d59a58e3207f356406689ce4844d3a1d2202", cert["git_commit"]
          print(json.dumps({
              "g1_exact": readiness["announcement_exact_resolved"],
              "g1_excluded": readiness["announcement_events_excluded"],
              "g2_covered": cert["real_data_state"]["coverage"]["covered_real_source_date_rows"],
              "g5_controls": cert["real_data_state"]["metadata"]["control_dates_resolved"],
              "g6_blocking_issues": quality["blocking_issue_count"],
              "software_ready": cert["software_ready"],
              "overall_status": cert["overall_status"],
              "source_commit": cert["git_commit"],
          }, indent=2))
          PY

      - name: Preserve generated files
        run: |
          python - <<'PY'
          import json, shutil, subprocess
          from pathlib import Path

          prefixes=(
              "data/processed/authorized_input_real/",
              "data/processed/real_data_replay/",
              "data/processed/software_readiness/",
          )
          rows=subprocess.check_output(["git","status","--porcelain"], text=True).splitlines()
          files=[]
          deletions=[]
          for row in rows:
              status=row[:2]
              path=row[3:]
              if " -> " in path:
                  path=path.split(" -> ",1)[1]
              if not path.startswith(prefixes):
                  continue
              if "D" in status:
                  deletions.append(path)
                  continue
              p=Path(path)
              if p.is_file():
                  dest=Path("/tmp/generated")/path
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  shutil.copy2(p,dest)
                  files.append(path)
          Path("/tmp/generated_manifest.json").write_text(json.dumps({"files":files,"deletions":deletions},indent=2))
          print(Path("/tmp/generated_manifest.json").read_text())
          PY

      - name: Apply generated files to receipt branch
        run: |
          git reset --hard
          git clean -fd
          git fetch origin "$TARGET_BRANCH"
          git switch -C "$TARGET_BRANCH" "origin/$TARGET_BRANCH"

          python - <<'PY'
          import json, shutil
          from pathlib import Path
          m=json.loads(Path("/tmp/generated_manifest.json").read_text())
          for path in m["files"]:
              src=Path("/tmp/generated")/path
              dst=Path(path)
              dst.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(src,dst)
          for path in m["deletions"]:
              Path(path).unlink(missing_ok=True)
          PY

          git rm -f .github/workflows/regenerate-authoritative-receipts.yml

      - name: Re-pin release drift identities
        run: |
          python - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path

          base="3b68d59a58e3207f356406689ce4844d3a1d2202"
          allow=Path("config/release_drift_allowlist.json")
          obj=json.loads(allow.read_text())
          prefixes=(
              "data/processed/authorized_input_real/",
              "data/processed/real_data_replay/",
              "data/processed/software_readiness/",
          )
          changed=[]
          for row in subprocess.check_output(["git","status","--porcelain"], text=True).splitlines():
              path=row[3:]
              if " -> " in path:
                  path=path.split(" -> ",1)[1]
              if path.startswith(prefixes) and Path(path).is_file():
                  changed.append(path)

          reason=(
              "Authoritative receipt regeneration from main source commit "
              "3b68d59a58e3207f356406689ce4844d3a1d2202 after incremental G1 evidence recovery; "
              "generated by metadata resolver, metadata quality, real-data replay, and software certification."
          )
          for path in sorted(set(changed)):
              digest=hashlib.sha256(Path(path).read_bytes()).hexdigest()
              exists=(subprocess.run(["git","cat-file","-e",f"{base}:{path}"],
                                     stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode==0)
              if exists:
                  obj["repository_additions"].pop(path,None)
                  obj["intentional_release_modifications"][path]={"expected_sha256":digest,"reason":reason}
              else:
                  obj["intentional_release_modifications"].pop(path,None)
                  obj["repository_additions"][path]={"expected_sha256":digest,"reason":reason}
          allow.write_text(json.dumps(obj,indent=2)+"\n")
          print("re-pinned",len(set(changed)),"generated files")
          PY

      - name: Verify release drift and commit receipts
        run: |
          TRUST_ROOT="$(sha256sum config/release_drift_allowlist.json | awk '{print $1}')"
          python scripts/verify_release_drift.py \
            --root . \
            --expected-exceptions-sha256 "$TRUST_ROOT"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/release_drift_allowlist.json
          git add data/processed/authorized_input_real
          git add data/processed/real_data_replay
          git add data/processed/software_readiness
          git add -u .github/workflows/regenerate-authoritative-receipts.yml
          git status --short
          git commit -m "Regenerate authoritative trading-platform receipts"
          git push origin "HEAD:$TARGET_BRANCH"
