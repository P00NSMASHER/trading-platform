name: G1 GNTX GlobeNewswire archive scan
on:
  push:
    branches: [g1/research-gntx-globenewswire]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Sample archive pages around October 2013
        run: |
          python - <<'PY'
          import urllib.request,re,html
          ua={"User-Agent":"Mozilla/5.0"}
          pages=[241255,241300,241400,241500,241600,241700,241800,242000,242200,242500]
          for p in pages:
            url=f"https://www.globenewswire.com/en/news-wire-newsroom?page={p}&pageSize=10"
            try:
              req=urllib.request.Request(url,headers=ua)
              raw=urllib.request.urlopen(req,timeout=20).read().decode("utf-8","replace")
              plain=html.unescape(re.sub(r"<[^>]+>"," ",raw)); plain=re.sub(r"\s+"," ",plain)
              dates=re.findall(r'(?:September|October|November|December)\s+\d{1,2},\s+2013\s+\d{2}:\d{2}\s+ET',plain)
              print("PAGE",p,"DATES",dates[:3],dates[-3:],"GENTEX",plain.lower().find("gentex"))
              if "Gentex Reports Third Quarter 2013 Financial Results" in plain:
                i=plain.find("Gentex Reports Third Quarter 2013 Financial Results")
                print("FOUND",p,plain[max(0,i-600):i+1000])
            except Exception as e: print("ERR",p,repr(e))
          PY
