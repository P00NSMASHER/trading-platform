name: G1 Batch 0105 Worker 0 Publisher
on:
  push:
    branches:
      - g1/integrate-0105-worker-0-41e0713
permissions:
  contents: write
jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: g1/integrate-0105-worker-0-41e0713
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project dependencies
        run: python -m pip install .
      - name: Generate deterministic G1 batch 0105
        run: |
          set +e
          PYTHONPATH=src python scripts/g1_batch_0105_generate.py > /tmp/g1-output.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            cp /tmp/g1-output.log g1_batch_0105_failure.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add g1_batch_0105_failure.log
            git commit -m "ci(g1): preserve batch 0105 publisher failure"
            git push origin HEAD:g1/integrate-0105-worker-0-41e0713
            exit "$status"
          fi
          cat /tmp/g1-output.log
      - name: Commit generated canonical candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "G1: recover 8 court clocks, 145 exact / 29 excluded [g1-generated]"
          git push origin HEAD:g1/integrate-0105-worker-0-41e0713
