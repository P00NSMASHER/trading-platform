name: G1 Yahoo wire bulk sweep
on:
  push:
    branches:
      - g1/yahoo-wire-bulk-sweep-v3
permissions:
  contents: read
jobs:
  sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Sweep provider-confirmed Yahoo wires
        run: python scripts/g1_yahoo_wire_bulk_sweep.py
      - name: Upload sweep
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: g1-yahoo-wire-bulk-sweep-${{ github.sha }}
          path: private_runtime/audit/g1-yahoo-wire-sweep
          if-no-files-found: warn
          retention-days: 30
