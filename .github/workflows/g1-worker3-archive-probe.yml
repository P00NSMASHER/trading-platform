name: G1 worker 3 archive probe
on:
  push:
    branches:
      - 'g1/public-batch--worker-3-archive-probe'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - run: python scripts/g1_worker3_archive_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: g1-worker3-archive-probe
          path: g1_worker3_archive_probe/
          retention-days: 7
