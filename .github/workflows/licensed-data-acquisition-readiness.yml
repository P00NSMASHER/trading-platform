name: licensed-data-acquisition-readiness

on:
  push:
    branches: [fix/licensed-data-acquisition-readiness]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: licensed-data-acquisition-readiness
  cancel-in-progress: true

jobs:
  prepare:
    if: "!contains(github.event.head_commit.message, '[licensed-data-readiness-generated]')"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade "pip==26.2.1"
          python -m pip install -r requirements.lock
          python -m pip install -r requirements-dev.lock

      - name: Rebuild acquisition receipts
        run: |
          python -m real_data_release_sprint freeze \
            --source-date-requirements data/processed/coverage_plan_real/source_date_requirements.csv \
            --event-exchange-resolutions data/processed/authorized_input_real/event_exchange_resolutions.csv \
            --outdir data/processed/real_data_release_sprint
          python -m real_data_release_sprint refresh-coverage \
            --coverage-summary data/processed/coverage_plan_real/coverage_summary.json \
            --metadata-readiness data/processed/authorized_input_real/metadata_readiness_summary.json \
            --metadata-quality data/processed/authorized_input_real/metadata_quality_summary.json \
            --requirements-manifest data/processed/real_data_release_sprint/requirements_manifest.json \
            --unresolved-gates data/processed/coverage_plan_real/unresolved_gates.csv
          python -m real_data_release_sprint status \
            --requirements-manifest data/processed/real_data_release_sprint/requirements_manifest.json \
            --coverage-summary data/processed/coverage_plan_real/coverage_summary.json \
            --metadata-readiness data/processed/authorized_input_real/metadata_readiness_summary.json \
            --metadata-quality data/processed/authorized_input_real/metadata_quality_summary.json \
            --out data/processed/real_data_release_sprint/step_status.json

      - name: Assert historical ITCH version split
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          p=Path("data/processed/real_data_release_sprint")
          m=json.loads((p/"requirements_manifest.json").read_text())
          assert m["counts"]["g3_confirmed_nasdaq_event_rows"] == 80
          assert m["counts"]["g3_confirmed_nasdaq_itch_4_1_event_rows"] == 35
          assert m["counts"]["g3_confirmed_nasdaq_itch_5_0_event_rows"] == 45
          rows=list(csv.DictReader((p/"g2_itch_event_requirements.csv").open()))
          assert len(rows)==80
          assert sum(r["source_family"]=="nasdaq_itch_4_1_decoded" for r in rows)==35
          assert sum(r["source_family"]=="nasdaq_itch_5_0_decoded" for r in rows)==45
          PY

      - name: Focused licensed-data tests
        run: |
          python -m pytest -q \
            tests/test_historical_market_backfill.py \
            tests/test_coverage_planner.py \
            tests/test_real_data_release_sprint.py \
            tests/test_market_data_adapter.py

      - name: Update release-drift hashes
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          p=Path("config/release_drift_allowlist.json")
          obj=json.loads(p.read_text(encoding="utf-8"))
          manifest=json.loads(Path("RELEASE_MANIFEST.json").read_text(encoding="utf-8"))
          release_paths={str(x["path"]) for x in manifest.get("files",[])}
          reason=(
            "Licensed-data acquisition readiness: support Nasdaq ITCH 4.1 and 5.0, union split/sharded "
            "authorized vendor files for G2 date coverage, and regenerate exact acquisition receipts."
          )
          paths=[
            "src/historical_market_backfill.py",
            "src/coverage_planner.py",
            "src/real_data_release_sprint.py",
            "tests/test_historical_market_backfill.py",
            "tests/test_coverage_planner.py",
            "tests/test_real_data_release_sprint.py",
            "docs/licensed_data_acquisition.md",
            "data/processed/real_data_release_sprint/requirements_manifest.json",
            "data/processed/real_data_release_sprint/g2_itch_event_requirements.csv",
            "data/processed/real_data_release_sprint/production_source_contract_blueprint.json",
            "data/processed/real_data_release_sprint/step_status.json",
            "data/processed/coverage_plan_real/coverage_summary.json",
            "data/processed/coverage_plan_real/unresolved_gates.csv",
          ]
          def sha(path):
              h=hashlib.sha256()
              with Path(path).open("rb") as f:
                  for chunk in iter(lambda:f.read(1024*1024),b""):
                      h.update(chunk)
              return h.hexdigest()
          mods=obj["intentional_release_modifications"]; adds=obj["repository_additions"]
          for path in paths:
              detail={"expected_sha256":sha(path),"reason":reason}
              mods.pop(path,None); adds.pop(path,None)
              if path in release_paths: mods[path]=detail
              else: adds[path]=detail
          p.write_text(json.dumps(obj,indent=2)+"\n",encoding="utf-8")
          PY

      - name: Commit generated receipts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            config/release_drift_allowlist.json \
            data/processed/real_data_release_sprint \
            data/processed/coverage_plan_real/coverage_summary.json \
            data/processed/coverage_plan_real/unresolved_gates.csv
          git commit -m "[licensed-data-readiness-generated] refresh acquisition receipts"
          git push origin HEAD:fix/licensed-data-acquisition-readiness
