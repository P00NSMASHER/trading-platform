name: Validate Step 21

on:
  push:
    branches: [import-step21, main]
    paths-ignore:
      - bootstrap/**
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock -r requirements-dev.lock

      - name: Restore private runtime permissions
        run: |
          PYTHONPATH=src python src/deployment_hardening.py harden-permissions --config config/runtime.demo.toml

      - name: Run full test suite
        run: |
          PYTHONPATH=src python -m pytest -q

      - name: Run private self-check
        run: |
          PYTHONPATH=src python src/deployment_hardening.py self-check --config config/runtime.demo.toml --report /tmp/self-check.json
          cat /tmp/self-check.json
