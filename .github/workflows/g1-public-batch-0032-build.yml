name: g1-public-batch-0032-build
on:
  push:
    branches: [data/g1-public-batch-0032-amd-hae]
    paths: [.github/workflows/g1-public-batch-0032-build.yml]
permissions:
  contents: write
concurrency:
  group: g1-public-batch-0032-build
  cancel-in-progress: false
jobs:
  rebuild-reviewed-batch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
      - name: Install repository-locked dependencies
        run: |
          python -m pip install --upgrade 'pip==26.2.1'
          python -m pip install -r requirements.lock -r requirements-dev.lock
      - name: Rebuild the reviewed two-event batch from the frozen base
        run: |
          python - <<'PY'
          import csv, hashlib, json, os, re, subprocess, sys
          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo
          import research_receipt_rebuild as rebuild
          import g1_acquisition_manifest as acquisition
          import real_data_release_sprint as sprint

          ROOT = Path.cwd()
          BASE = 'ea09d64fa029eec7439cc3850dcba5999db0ed1b'
          FROZEN = '43fb221eed14c2a00a0e9d4531fe365dd264128625877a6cfc986cf50f862f12'
          TEMP_WORKFLOW = '.github/workflows/g1-public-batch-0032-build.yml'
          BATCH = 'data/public/metadata/g1_announcement_times_batch_0032.csv'
          EVIDENCE = 'data/public/metadata/g1_announcement_times_batch_0032_evidence.json'
          META = Path('data/processed/authorized_input_real')
          EXCLUSION = META / 'g1_final_timing_exclusions.json'
          CONTRACT = Path('config/metadata_sources.public_progress.json')
          RESEARCH = Path('data/public/metadata/g1_source_research_20260928.json')
          COVERAGE = Path('data/processed/coverage_plan_real/coverage_summary.json')
          SPRINT = Path('data/processed/real_data_release_sprint')
          NY = ZoneInfo('America/New_York')
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          def load(p): return json.loads(Path(p).read_text(encoding='utf-8'))
          def save(p, value): Path(p).write_text(json.dumps(value, indent=2, ensure_ascii=True) + '\n', encoding='utf-8')
          def csv_rows(p):
              with Path(p).open(newline='', encoding='utf-8') as f: return list(csv.DictReader(f))
          assert os.environ['GITHUB_REF'] == 'refs/heads/data/g1-public-batch-0032-amd-hae'
          assert subprocess.check_output(['git','rev-parse','HEAD^'], text=True).strip() == BASE
          assert sha('data/processed/historical_events.csv') == FROZEN
          assert not Path(BATCH).exists() and not Path(EVIDENCE).exists()
          before = load(META / 'metadata_readiness_summary.json')
          assert (before['event_count'], before['announcement_exact_resolved'], before['announcement_events_excluded']) == (174,33,141)
          events = {r['event_id']:r for r in csv_rows('data/processed/historical_events.csv')}
          old_resolutions = {r['event_id']:r for r in csv_rows(META / 'announcement_resolutions.csv')}
          candidates = [
              {
                  'event_id':'HEJFE-B46D4F8F72DD0212', 'historical_symbol':'AMD',
                  'first_trade':'2013-10-17 14:40:00', 'event_date':'2013-10-17',
                  'public_announcement_ts':'2013-10-17T16:15:00-04:00',
                  'timestamp_kind':'first_public_release', 'source_grade':'A',
                  'source_reference':'https://www.globenewswire.com/news-release/2013/10/17/1011233/0/en/amd-reports-2013-third-quarter-results.html',
                  'title':'AMD Reports 2013 Third Quarter Results',
                  'clock_evidence_kind':'publisher_timestamp',
                  'clock_quote':'October 17, 2013 16:15 ET',
                  'corroboration_reference':'https://ir.amd.com/news-events/press-releases/detail/451/amd-reports-2013-third-quarter-results',
                  'corroboration_detail':'Issuer archive reproduces the matching Marketwired October 17, 2013 third-quarter results, including $1.46 billion revenue and $48 million net income.',
                  'not_used_as_release_time':'The separate 5:30 p.m. ET teleconference time is not used.'
              },
              {
                  'event_id':'HEJFE-13FC93F4D143B268', 'historical_symbol':'HAE',
                  'first_trade':'2012-01-27 15:55:00', 'event_date':'2012-01-27',
                  'public_announcement_ts':'2012-01-30T08:00:00-05:00',
                  'timestamp_kind':'first_public_release', 'source_grade':'A',
                  'source_reference':'https://www.sec.gov/Archives/edgar/data/313143/000031314312000009/hae20121308kexhibit991.htm',
                  'title':'Haemonetics Reports 8% Revenue Growth for Third Quarter of Fiscal 2012 and $0.86 Adjusted EPS',
                  'clock_evidence_kind':'issuer_release_header',
                  'clock_quote':'FOR RELEASE: Date January 30, 2012 Time 8:00 am Eastern',
                  'corroboration_reference':'https://haemonetics.gcs-web.com/news-releases/news-release-details/haemonetics-reports-8-revenue-growth-third-quarter-fiscal-2012',
                  'corroboration_detail':'Issuer archive reproduces the matching January 30, 2012 PR Newswire earnings release, $191.2 million quarterly revenue and $0.86 adjusted EPS. The clock comes from the release header in SEC Exhibit 99.1, not EDGAR acceptance.',
                  'not_used_as_release_time':'The separate 10:00 a.m. Eastern webcast and EDGAR filing acceptance time are not used.'
              }
          ]
          excluded = load(EXCLUSION)
          old_excluded_ids = {r['event_id'] for r in excluded['exclusions']}
          assert len(old_excluded_ids) == 141
          promoted_ids = {r['event_id'] for r in candidates}
          assert len(promoted_ids) == 2 and promoted_ids <= old_excluded_ids
          fields = ['event_id','historical_symbol','event_date','public_announcement_ts','timestamp_kind','source_grade','source_reference']
          for row in candidates:
              event = events[row['event_id']]
              assert event['historical_symbol'] == row['historical_symbol']
              assert event['first_documented_illicit_trade_ts'] == row['first_trade']
              assert old_resolutions[row['event_id']]['resolution_status'] == 'excluded_fail_closed'
              trade = datetime.fromisoformat(row['first_trade']).replace(tzinfo=NY)
              release = datetime.fromisoformat(row['public_announcement_ts'])
              assert release.utcoffset() is not None and trade < release <= trade + timedelta(days=7)
              row['seconds_after_frozen_trade'] = int((release-trade).total_seconds())
              row['research_use_only'] = True
          with Path(BATCH).open('w', newline='', encoding='utf-8') as f:
              writer = csv.DictWriter(f, fieldnames=fields)
              writer.writeheader()
              writer.writerows({k:r[k] for k in fields} for r in candidates)
          save(EVIDENCE, {
              'schema_version':'1', 'base_main_sha':BASE,
              'frozen_events_sha256':FROZEN, 'batch_sha256':sha(BATCH),
              'research_use_only':True, 'evidence_review_date':'2026-09-29',
              'purpose':'Two reviewed public release-clock recoveries; no WRDS or licensed extract. Source quotes are short observed evidence excerpts, not synthetic fixtures.',
              'candidates':candidates,
              'policy':{'exact_clock_required':True,'exclusions_are_not_exact':True,'edgar_acceptance_substitution_prohibited':True,'conference_call_substitution_prohibited':True,'wrong_year_substitution_prohibited':True}
          })
          excluded['base_main_sha'] = BASE
          excluded['exclusions'] = [r for r in excluded['exclusions'] if r['event_id'] not in promoted_ids]
          excluded['g1_state'].update(exact_resolved=35, reviewed_excluded=139, raw_exact_time_evidence_gaps=139, exact_timing_analysis_eligible=35)
          assert len(excluded['exclusions']) == 139
          save(EXCLUSION, excluded)
          contract = load(CONTRACT)
          source = dict(contract['sources'][0])
          source.update(source_id='public-primary-clock-amd-hae-batch-0032',path=BATCH,
              license_reference='Public original Marketwired distribution timestamp for AMD and explicit issuer FOR RELEASE header in SEC Exhibit 99.1 for Haemonetics; each release is independently corroborated by its issuer archive. Narrow historical facts and source references only; no licensed vendor extract.',
              notes='Reviewed source provenance and short timestamp excerpts: ' + EVIDENCE)
          contract['sources'].insert(0, source)
          contract['purpose'] = contract['purpose'].replace('thirty-three','thirty-five')
          contract['reviewed_announcement_exclusions'].update(expected_sha256=sha(EXCLUSION),expected_count=139)
          save(CONTRACT, contract)
          research = load(RESEARCH)
          research['base_main_sha'] = BASE
          research['current_g1_state'].update(public_exact_batch_count=32,exact_resolved_event_records=35,reviewed_excluded_event_records=139,
              note='The repository is at batch_0032; cumulative exact event records are 35 because some public batches resolve more than one historical event.')
          for row in candidates:
              research['validation_probes'].append({
                  'probe_id':row['historical_symbol']+'-batch0032-resolved',
                  'event_id':row['event_id'],'historical_symbol':row['historical_symbol'],
                  'historical_event_match':True,'exact_clock_observed':True,
                  'exact_public_release_ts':row['public_announcement_ts'],
                  'timestamp_kind':'first_public_release','timestamp_evidence_kind':row['clock_evidence_kind'],
                  'source_family':'official_newswire_archive','source_reference':row['source_reference'],
                  'corroboration_reference':row['corroboration_reference'],
                  'evidence_eligible':False,'disposition':'RESOLVED_IN_BATCH_0032',
                  'reason':'Resolved through separately reviewed public batch_0032; this research hint is not itself resolution evidence.'})
          save(RESEARCH, research)
          receipt_result = rebuild.rebuild(ROOT, publish=True)
          assert receipt_result['after']['up_to_date']
          manifest = acquisition.build_manifest()
          Path('data/public/metadata/g1_acquisition_manifest.json').write_text(acquisition.render_manifest(manifest),encoding='utf-8')
          assert manifest['state']['exact_resolved'] == 35 and manifest['state']['acquisition_needed'] == 139
          sprint.refresh_coverage(coverage_summary_path=COVERAGE,metadata_readiness_path=META/'metadata_readiness_summary.json',metadata_quality_path=META/'metadata_quality_summary.json',requirements_manifest_path=SPRINT/'requirements_manifest.json',unresolved_gates_path=COVERAGE.parent/'unresolved_gates.csv')
          status = sprint.build_status(requirements_manifest_path=SPRINT/'requirements_manifest.json',coverage_summary_path=COVERAGE,metadata_readiness_path=META/'metadata_readiness_summary.json',metadata_quality_path=META/'metadata_quality_summary.json',outpath=SPRINT/'step_status.json')
          assert next(r for r in status['steps'] if r['step']==9)['status'] == 'SOURCE_BLOCKED'
          assert status['all_12_genuinely_complete'] is False
          after_resolutions = {r['event_id']:r for r in csv_rows(META/'announcement_resolutions.csv')}
          for event_id, old in old_resolutions.items():
              if event_id not in promoted_ids: assert after_resolutions[event_id] == old, event_id
          for row in candidates:
              resolved = after_resolutions[row['event_id']]
              assert resolved['resolution_status'] == 'resolved_exact_public_timestamp'
              assert datetime.fromisoformat(resolved['public_announcement_ts'].replace('Z','+00:00')) == datetime.fromisoformat(row['public_announcement_ts'])
          for name in ['tests/test_g1_source_research.py','tests/test_g1_acquisition_manifest.py']:
              path=Path(name); text=path.read_text()
              text=re.sub(r'== 33\b','== 35',text)
              text=re.sub(r'== 141\b','== 139',text)
              if name.endswith('test_g1_source_research.py'): text=text.replace('state["public_exact_batch_count"] == 31','state["public_exact_batch_count"] == 32')
              path.write_text(text,encoding='utf-8')
          path=Path('tests/test_real_data_release_sprint.py')
          text=path.read_text().replace('updated["missing_exact_announcement_timestamps"] == 141','updated["missing_exact_announcement_timestamps"] == 139')
          path.write_text(text,encoding='utf-8')
          tests = '''from __future__ import annotations
          import csv
          import hashlib
          import json
          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo
          import pytest
          ROOT = Path(__file__).resolve().parents[1]
          META = ROOT / "data/processed/authorized_input_real"
          def rows(p):
              with p.open(newline="", encoding="utf-8") as f: return list(csv.DictReader(f))
          @pytest.mark.parametrize("event_id,symbol,clock", [
              ("HEJFE-B46D4F8F72DD0212","AMD","2013-10-17T16:15:00-04:00"),
              ("HEJFE-13FC93F4D143B268","HAE","2012-01-30T08:00:00-05:00"),
          ])
          def test_reviewed_primary_clocks_resolve_exactly(event_id,symbol,clock):
              actual = {r["event_id"]:r for r in rows(META / "announcement_resolutions.csv")}[event_id]
              frozen = {r["event_id"]:r for r in rows(ROOT / "data/processed/historical_events.csv")}[event_id]
              release = datetime.fromisoformat(clock)
              trade = datetime.fromisoformat(frozen["first_documented_illicit_trade_ts"]).replace(tzinfo=ZoneInfo("America/New_York"))
              assert actual["historical_symbol"] == symbol
              assert actual["resolution_status"] == "resolved_exact_public_timestamp"
              assert actual["source_grade"] == "A"
              assert datetime.fromisoformat(actual["public_announcement_ts"].replace("Z","+00:00")) == release
              assert trade < release <= trade + timedelta(days=7)
          def test_batch_hash_and_primary_clock_semantics():
              batch=ROOT / "data/public/metadata/g1_announcement_times_batch_0032.csv"
              dossier=json.loads((ROOT / "data/public/metadata/g1_announcement_times_batch_0032_evidence.json").read_text())
              assert hashlib.sha256(batch.read_bytes()).hexdigest() == dossier["batch_sha256"]
              assert len(rows(batch)) == len(dossier["candidates"]) == 2
              assert {r["clock_evidence_kind"] for r in dossier["candidates"]} == {"publisher_timestamp","issuer_release_header"}
              assert all(r["corroboration_reference"].startswith("https://") for r in dossier["candidates"])
          def test_remaining_exclusions_stay_blank_and_step9_blocked():
              readiness=json.loads((META / "metadata_readiness_summary.json").read_text())
              assert (readiness["announcement_exact_resolved"],readiness["announcement_events_excluded"]) == (35,139)
              assert readiness["ready_g1_exact_timing_analysis"] is False
              excluded=[r for r in rows(META / "announcement_resolutions.csv") if r["resolution_status"]=="excluded_fail_closed"]
              assert len(excluded)==139
              assert all(not r["public_announcement_ts"] and not r.get("information_asymmetry_seconds") for r in excluded)
              status=json.loads((ROOT / "data/processed/real_data_release_sprint/step_status.json").read_text())
              step9=next(r for r in status["steps"] if r["step"]==9)
              assert step9["status"] == "SOURCE_BLOCKED"
              assert "35/174" in step9["evidence"] and "139" in step9["evidence"]
              assert status["all_12_genuinely_complete"] is False
          '''
          import textwrap
          Path('tests/test_g1_public_batch_0032.py').write_text(textwrap.dedent(tests),encoding='utf-8')
          path=Path('docs/g1_announcement_times.md'); text=path.read_text()
          text=text.replace('**31 public exact-time batches / 33 exact-resolved','**32 public exact-time batches / 35 exact-resolved')
          text+='\n### Batch 0032: AMD and Haemonetics public-clock recoveries\n\nAMD resolves at 2013-10-17 16:15 Eastern from the original Marketwired distribution, now preserved by GlobeNewswire. Haemonetics resolves at 2012-01-30 08:00 Eastern from the explicit FOR RELEASE header in SEC Exhibit 99.1. Each is corroborated by its issuer archive. See the batch_0032 evidence dossier for exact URLs and short timestamp excerpts. This is 35 exact / 139 reviewed exclusions, not Step 9 completion. No WRDS access or vendor extract was used.\n'
          path.write_text(text,encoding='utf-8')
          path=Path('docs/g1_final_timing_exclusions.md'); lines=path.read_text().splitlines(True)
          for i,line in enumerate(lines[:20]):
              if 'Exact first-public announcement timestamps resolved' in line or 'Events eligible for exact' in line: lines[i]=line.replace('33','35')
              if 'Immutable reviewed fail-closed exclusions' in line: lines[i]=line.replace('141','139')
          path.write_text(''.join(lines)+'\n## Public primary-clock batch 0032\n\nAMD and Haemonetics were removed from the exclusion set only after source-specific exact-clock review. The remaining 139 events retain blank release timestamps and remain excluded from timing-dependent analysis. Authoritative evidence: `data/public/metadata/g1_announcement_times_batch_0032_evidence.json`.\n',encoding='utf-8')
          assert sha('data/processed/historical_events.csv') == FROZEN
          assert load(META/'metadata_readiness_summary.json')['ready_g1_exact_timing_analysis'] is False
          subprocess.run(['git','rm',TEMP_WORKFLOW],check=True)
          existing = subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          new_paths = [BATCH,EVIDENCE,'tests/test_g1_public_batch_0032.py']
          changed = sorted(set(existing + new_paths))
          allowed_roots=('config/metadata_sources.public_progress.json','data/processed/authorized_input_real/','data/processed/real_data_replay/real_data_replay_status.json','data/processed/research_receipt_bundle.json','data/processed/coverage_plan_real/','data/processed/real_data_release_sprint/step_status.json','data/public/metadata/','docs/g1_','tests/test_g1_','tests/test_real_data_release_sprint.py')
          assert all(p.startswith(allowed_roots) for p in changed), changed
          allow_path=Path('config/release_drift_allowlist.json'); allow=load(allow_path)
          for name in changed:
              sections=[section for section in ['intentional_release_modifications','repository_additions'] if name in allow[section]]
              assert len(sections)==1 or name in new_paths, name
              section=sections[0] if sections else 'repository_additions'
              allow[section][name]={'expected_sha256':sha(name),'reason':'Reviewed public batch 0032: AMD original Marketwired and Haemonetics SEC issuer release-header exact clocks; deterministic 35 exact / 139 reviewed-exclusion receipts, routing and focused regressions. No release gate is relaxed.'}
          save(allow_path,allow)
          subprocess.run(['git','add','--',*changed,str(allow_path)],check=True)
          receipt={'base_main_sha':BASE,'exact_before':33,'exact_after':35,'excluded_after':139,'step9_status':'SOURCE_BLOCKED','changed_paths':changed,'batch_sha256':sha(BATCH),'evidence_sha256':sha(EVIDENCE),'frozen_events_sha256':FROZEN}
          audit=Path('private_runtime/audit/g1-public-batch-0032'); audit.mkdir(parents=True,exist_ok=True)
          save(audit/'build_receipt.json',receipt)
          (audit/'candidate.patch').write_bytes(subprocess.check_output(['git','diff','--cached','--binary']))
          print(json.dumps(receipt,indent=2))
          PY
      - name: Harden test runtime permissions
        run: python -m deployment_hardening harden-permissions --config config/runtime.demo.toml
      - name: Verify focused evidence, deterministic receipts and drift
        run: |
          python -m pytest -q tests/test_g1_public_batch_0032.py tests/test_g1_source_research.py tests/test_g1_acquisition_manifest.py tests/test_real_data_release_sprint.py tests/test_research_receipt_rebuild.py tests/test_release_drift.py --junitxml=private_runtime/audit/g1-public-batch-0032/focused-junit.xml
          python -m research_receipt_rebuild --check
          python -m g1_acquisition_manifest --check
      - name: Publish generated candidate to this branch only
        run: |
          test "$GITHUB_REF" = refs/heads/data/g1-public-batch-0032-amd-hae
          git diff --exit-code
          git config user.name 'G1 public evidence builder'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'G1: recover AMD and Haemonetics; rebuild 35-of-174 receipts'
          git push origin HEAD:refs/heads/data/g1-public-batch-0032-amd-hae
      - name: Retain build and focused-test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: g1-public-batch-0032-${{ github.sha }}
          path: private_runtime/audit/g1-public-batch-0032
          if-no-files-found: warn
          retention-days: 30
