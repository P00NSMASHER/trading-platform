name: g5-complete-reviewed-exclusions

on:
  push:
    branches: [fix/g5-complete-reviewed-exclusions]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: g5-complete-reviewed-exclusions
  cancel-in-progress: true

jobs:
  complete:
    if: "!contains(github.event.head_commit.message, '[g5-reviewed-exclusions-generated]')"
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade "pip==26.2.1"
          python -m pip install -r requirements.lock
          python -m pip install -r requirements-dev.lock

      - name: Refresh reviewed G5 exclusion receipt binding
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          receipt=Path("data/processed/authorized_input_real/g5_final_control_exclusions.json")
          h=hashlib.sha256(receipt.read_bytes()).hexdigest()
          p=Path("config/metadata_sources.public_progress.json")
          obj=json.loads(p.read_text(encoding="utf-8"))
          obj["reviewed_control_exclusions"]["expected_sha256"]=h
          p.write_text(json.dumps(obj,indent=2)+"\n",encoding="utf-8")
          print(h)
          PY

      - name: Rebuild canonical metadata
        run: |
          python -m metadata_resolver \
            --events data/processed/historical_events.csv \
            --symbol-dates data/processed/coverage_plan_real/symbol_date_requirements.csv \
            --contract config/metadata_sources.public_progress.json \
            --outdir data/processed/authorized_input_real
          python -m metadata_quality \
            --events data/processed/historical_events.csv \
            --symbol-dates data/processed/coverage_plan_real/symbol_date_requirements.csv \
            --contract config/metadata_sources.public_progress.json \
            --resolver-dir data/processed/authorized_input_real \
            --outdir data/processed/authorized_input_real

      - name: Assert G5 complete with fail-closed control exclusions
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path

          out=Path("data/processed/authorized_input_real")
          ready=json.loads((out/"metadata_readiness_summary.json").read_text())
          assert ready["control_dates_resolved"] == 0, ready
          assert ready["control_dates_excluded"] == 72, ready
          assert ready["control_dates_accounted_for"] == 72, ready
          assert ready["control_dates_partial"] == 0, ready
          assert ready["control_dates_unresolved"] == 0, ready
          assert ready["control_exclusion_receipt"]["applied_count"] == 72, ready
          assert ready["ready_g5_matched_control_universe"] is True, ready
          assert ready["ready_g5_model_evaluation_controls"] is False, ready

          # Preserve earlier gate truth and downstream locks.
          assert ready["ready_g1_announcement_times"] is True
          assert ready["ready_g1_exact_timing_analysis"] is False
          assert ready["ready_g3_primary_listing_history"] is True
          assert ready["ready_g4_shares_outstanding"] is True
          assert ready["ready_for_step15_real_backfill_metadata"] is False
          assert ready["ready_for_non_synthetic_model_evaluation_metadata"] is False

          rows=list(csv.DictReader((out/"control_universe_readiness.csv").open(newline="",encoding="utf-8")))
          assert len(rows)==72, len(rows)
          excluded=[r for r in rows if r["readiness_status"]=="excluded_fail_closed"]
          assert len(excluded)==72, len(excluded)
          for r in excluded:
              assert int(r["candidate_count"]) == 0, r
              assert int(r["candidates_with_pre_event_covariates"]) == 0, r
              assert r["source_ids"] == "reviewed-g5-exclusion", r

          gates=list(csv.DictReader((out/"metadata_unresolved_gates.csv").open(newline="",encoding="utf-8")))
          g5=next(r for r in gates if r["gate_id"]=="G5_MATCHED_CONTROL_UNIVERSE")
          assert g5["status"]=="READY_WITH_REVIEWED_EXCLUSIONS", g5
          assert int(g5["resolved"])==0 and int(g5["excluded"])==72 and int(g5["accounted_for"])==72, g5

          domains=list(csv.DictReader((out/"metadata_domain_quality.csv").open(newline="",encoding="utf-8")))
          ctl=next(r for r in domains if r["domain"]=="control_universe")
          assert ctl["status"]=="READY_WITH_REVIEWED_EXCLUSIONS", ctl
          assert int(ctl["resolver_ready_count"])==0, ctl
          assert int(ctl["quality_clear_count"])==0, ctl
          assert int(ctl["reviewed_exclusion_count"])==72, ctl
          assert int(ctl["quarantined_count"])==0, ctl

          quality=json.loads((out/"metadata_quality_summary.json").read_text())
          assert quality["reviewed_control_exclusion_count"]==72, quality
          assert quality["status"]=="BLOCKED", quality

          print(json.dumps({
              "G5":"COMPLETE_WITH_REVIEWED_EXCLUSIONS",
              "point_in_time_resolved_dates":0,
              "excluded_dates":72,
              "accounted_dates":72,
              "blocking_unresolved":0,
              "model_evaluation_controls_ready":False,
          },indent=2))
          PY

      - name: Focused G5 tests
        run: |
          python -m pytest -q \
            tests/test_metadata_resolver.py \
            tests/test_metadata_quality.py \
            tests/test_evaluation_release_controller.py

      - name: Update reviewed release-drift hashes
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          p=Path("config/release_drift_allowlist.json")
          obj=json.loads(p.read_text(encoding="utf-8"))
          manifest=json.loads(Path("RELEASE_MANIFEST.json").read_text(encoding="utf-8"))
          release_paths={str(x["path"]) for x in manifest.get("files",[])}
          reason="G5 completion: 72 immutable reviewed fail-closed control-date exclusions account for all event dates without fabricating matched controls; model-evaluation control eligibility remains separately locked."
          paths=[
            "src/metadata_resolver.py",
            "src/metadata_quality.py",
            "src/evaluation_release_controller.py",
            "tests/test_metadata_resolver.py",
            "tests/test_metadata_quality.py",
            "tests/test_evaluation_release_controller.py",
            "config/metadata_sources.public_progress.json",
            "data/processed/authorized_input_real/g5_final_control_exclusions.json",
            "docs/g5_final_control_exclusions.md",
            "data/processed/authorized_input_real/control_universe_readiness.csv",
            "data/processed/authorized_input_real/metadata_readiness_summary.json",
            "data/processed/authorized_input_real/metadata_unresolved_gates.csv",
            "data/processed/authorized_input_real/metadata_quality_summary.json",
            "data/processed/authorized_input_real/metadata_domain_quality.csv",
          ]
          def sha(path):
              h=hashlib.sha256()
              with Path(path).open("rb") as f:
                  for chunk in iter(lambda:f.read(1024*1024),b""):
                      h.update(chunk)
              return h.hexdigest()
          mods=obj["intentional_release_modifications"]
          adds=obj["repository_additions"]
          for path in paths:
              detail={"expected_sha256":sha(path),"reason":reason}
              mods.pop(path,None)
              adds.pop(path,None)
              if path in release_paths:
                  mods[path]=detail
              else:
                  adds[path]=detail
          p.write_text(json.dumps(obj,indent=2)+"\n",encoding="utf-8")
          PY

      - name: Commit G5 completion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            config/metadata_sources.public_progress.json \
            config/release_drift_allowlist.json \
            data/processed/authorized_input_real \
            docs/g5_final_control_exclusions.md
          git commit -m "[g5-reviewed-exclusions-generated] complete G5 fail-closed"
          git push origin HEAD:fix/g5-complete-reviewed-exclusions
