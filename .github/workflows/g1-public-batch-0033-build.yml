name: g1-public-batch-0033-build
on:
  push:
    branches: [data/g1-public-batch-0033-pfpt-vrsn]
    paths: [.github/workflows/g1-public-batch-0033-build.yml]
permissions:
  contents: write
concurrency:
  group: g1-public-batch-0033-build
  cancel-in-progress: false
jobs:
  rebuild-reviewed-batch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
      - name: Install repository-locked dependencies
        run: |
          python -m pip install --upgrade 'pip==26.2.1'
          python -m pip install -r requirements.lock -r requirements-dev.lock
      - name: Rebuild reviewed two-event batch from frozen base
        run: |
          python - <<'PY'
          from __future__ import annotations
          import copy, csv, hashlib, json, os, re, subprocess
          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo
          import g1_acquisition_manifest as acquisition
          import g1_source_research as research_validator
          import real_data_release_sprint as sprint
          import research_receipt_rebuild as rebuild
          ROOT = Path.cwd()
          BASE = '88dfa6fa4f69a6c9f33714edca92442376dfc8d4'
          BRANCH = 'data/g1-public-batch-0033-pfpt-vrsn'
          FROZEN = '43fb221eed14c2a00a0e9d4531fe365dd264128625877a6cfc986cf50f862f12'
          TEMP_WORKFLOW = '.github/workflows/g1-public-batch-0033-build.yml'
          BATCH = Path('data/public/metadata/g1_announcement_times_batch_0033.csv')
          EVIDENCE = Path('data/public/metadata/g1_announcement_times_batch_0033_evidence.json')
          TEST = Path('tests/test_g1_public_batch_0033.py')
          META = Path('data/processed/authorized_input_real')
          EXCLUSION = META/'g1_final_timing_exclusions.json'
          CONTRACT = Path('config/metadata_sources.public_progress.json')
          RESEARCH = Path('data/public/metadata/g1_source_research_20260928.json')
          COVERAGE = Path('data/processed/coverage_plan_real/coverage_summary.json')
          SPRINT = Path('data/processed/real_data_release_sprint')
          NY = ZoneInfo('America/New_York')
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          def load(p): return json.loads(Path(p).read_text(encoding='utf-8'))
          def save(p, obj): Path(p).write_text(json.dumps(obj, indent=2, ensure_ascii=True)+'\n', encoding='utf-8')
          def rows(p):
              with Path(p).open(newline='', encoding='utf-8') as f: return list(csv.DictReader(f))
          def rows_hash(items):
              return hashlib.sha256(json.dumps(items, sort_keys=True, separators=(',',':')).encode('utf-8')).hexdigest()
          assert os.environ['GITHUB_REF'] == 'refs/heads/'+BRANCH
          assert subprocess.check_output(['git','rev-parse','HEAD^'], text=True).strip() == BASE
          assert sha('data/processed/historical_events.csv') == FROZEN
          assert not any(p.exists() for p in (BATCH,EVIDENCE,TEST))
          before = load(META/'metadata_readiness_summary.json')
          assert (before['event_count'],before['announcement_exact_resolved'],before['announcement_events_excluded']) == (174,35,139)
          events = {r['event_id']:r for r in rows('data/processed/historical_events.csv')}
          old_resolutions = {r['event_id']:r for r in rows(META/'announcement_resolutions.csv')}
          assert len(events) == len(old_resolutions) == 174
          excluded = load(EXCLUSION)
          research = load(RESEARCH)
          old_exclusion_by_id = {r['event_id']:r for r in excluded['exclusions']}
          candidates = [
              {
                  'event_id':'HEJFE-6C73B4B05384BC1E','historical_symbol':'PFPT',
                  'first_trade':'2013-04-25 15:00:00','event_date':'2013-04-25',
                  'public_announcement_ts':'2013-04-25T16:05:00-04:00',
                  'source_reference':'https://finance.yahoo.com/news/proofpoint-announces-first-quarter-2013-200500289.html',
                  'title':'Proofpoint Announces First Quarter 2013 Financial Results',
                  'corroboration_reference':'https://www.sec.gov/Archives/edgar/data/1212458/000110465913033018/a13-10811_1ex99d1.htm',
                  'corroboration_detail':'SEC Exhibit 99.1 matches the April 25, 2013 title, quarter ended March 31, revenue of $30.8 million, billings of $35.1 million and GAAP EPS loss of $0.19. The SEC exhibit corroborates release identity/content, not the clock.',
              },
              {
                  'event_id':'HEJFE-1FCAAB3F7CC931CF','historical_symbol':'VRSN',
                  'first_trade':'2013-04-25 14:07:00','event_date':'2013-04-25',
                  'public_announcement_ts':'2013-04-25T16:05:00-04:00',
                  'source_reference':'https://finance.yahoo.com/news/verisign-reports-15-percent-over-200500976.html',
                  'title':'Verisign Reports 15 Percent Year-Over-Year Revenue Growth in First Quarter 2013',
                  'corroboration_reference':'https://www.sec.gov/Archives/edgar/data/1014473/000101447313000027/ex991.htm',
                  'corroboration_detail':'SEC Exhibit 99.1 matches the April 25, 2013 title, quarter ended March 31, revenue of $236 million, net income of $85 million and GAAP EPS of $0.52. The SEC exhibit corroborates release identity/content, not the clock.',
              },
          ]
          for r in candidates:
              r.update(timestamp_kind='first_public_release',source_grade='B',
                  evidence_source_family='preserved_wire_mirror',clock_evidence_kind='publisher_timestamp',
                  original_wire_publisher_byline='Marketwired',
                  observed_html_time_datetime='2013-04-25T20:05:00+00:00',
                  visible_publication_date='April 25, 2013',visible_clock_observed=False,
                  later_update_time_separately_shown=False,original_wire_source_link_observed=None,
                  observation_method='Read-only browser inspection of the article HTML time datetime attribute and Marketwired byline; the date alone and digits in the URL were not used.',
                  observation_run_id='0c282afc-12fd-4ca6-a5fa-be5c178b94b5',
                  source_grade_reason='Grade B: clock preserved by a Marketwired-attributed syndication copy, not independently fetched from the original wire archive. SEC corroboration establishes matching release identity, not independent clock confirmation.',
                  prohibited_substitutes_not_used=['URL-derived clock','conference call time','EDGAR acceptance time','archive capture time','scheduled release notice'],
                  separate_conference_call_time_not_used='2013-04-25 16:30 America/New_York',
                  research_use_only=True)
              e = events[r['event_id']]
              assert e['historical_symbol'] == r['historical_symbol'] and e['first_documented_illicit_trade_ts'] == r['first_trade']
              assert r['event_id'] in old_exclusion_by_id
              assert old_resolutions[r['event_id']]['resolution_status'] == 'excluded_fail_closed'
              release = datetime.fromisoformat(r['public_announcement_ts'])
              observed = datetime.fromisoformat(r['observed_html_time_datetime'])
              trade = datetime.fromisoformat(r['first_trade']).replace(tzinfo=NY)
              assert release == observed and trade < release <= trade+timedelta(days=7)
              r['seconds_after_frozen_trade'] = int((release-trade).total_seconds())
              probe = dict(probe_id=r['historical_symbol']+'-batch0033-review',event_id=r['event_id'],historical_symbol=r['historical_symbol'],historical_event_match=True,exact_clock_observed=True,exact_public_release_ts=r['public_announcement_ts'],timestamp_kind='first_public_release',timestamp_evidence_kind='publisher_timestamp',source_family='preserved_wire_mirror',source_reference=r['source_reference'],corroboration_reference=r['corroboration_reference'],evidence_eligible=True)
              research_validator._validate_evidence_eligible_probe(probe, old_exclusion_by_id)
          assert {r['seconds_after_frozen_trade'] for r in candidates} == {3900,7080}
          promoted = {r['event_id'] for r in candidates}
          assert len(promoted) == 2
          unchanged_hash = rows_hash({k:v for k,v in old_resolutions.items() if k not in promoted})
          fields = ['event_id','historical_symbol','event_date','public_announcement_ts','timestamp_kind','source_grade','source_reference']
          with BATCH.open('w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows({k:r[k] for k in fields} for r in candidates)
          save(EVIDENCE,dict(schema_version='1',base_main_sha=BASE,frozen_events_sha256=FROZEN,batch_sha256=sha(BATCH),research_use_only=True,evidence_review_date='2026-09-29',purpose='Two reviewed Marketwired syndication-clock recoveries, explicitly Grade B; no WRDS, licensed extract, URL-time inference or new first-public clock inferred from SEC data.',before=dict(exact=35,excluded=139),after=dict(exact=37,excluded=137),non_promoted_resolution_rows_sha256=unchanged_hash,candidates=candidates,policy=dict(exact_clock_required=True,exclusions_are_not_exact=True,syndicated_clock_not_primary_wire_claim=True,sec_corroboration_not_independent_clock_claim=True,publication_metadata_not_modified_time=True,conference_call_substitution_prohibited=True,edgar_acceptance_substitution_prohibited=True,url_clock_inference_prohibited=True)))
          excluded['base_main_sha']=BASE
          excluded['exclusions']=[r for r in excluded['exclusions'] if r['event_id'] not in promoted]
          excluded['g1_state'].update(exact_resolved=37,reviewed_excluded=137,raw_exact_time_evidence_gaps=137,exact_timing_analysis_eligible=37)
          assert len(excluded['exclusions'])==137
          save(EXCLUSION,excluded)
          contract=load(CONTRACT)
          source=copy.deepcopy(contract['sources'][0])
          source.update(source_id='public-yahoo-marketwired-pfpt-vrsn-batch-0033',path=str(BATCH),source_family='official_newswire_archive',license_reference='Public Marketwired-attributed press-release syndication copies on Yahoo Finance. Exact article time datetime attributes observed with timezone offsets; SEC exhibits independently corroborate release identity/date/content. Grade B preserves the mirror-only clock provenance. Narrow factual metadata only, not a license to republish the full articles.',notes='Source observations and provenance limitations: '+str(EVIDENCE))
          contract['sources'].insert(0,source)
          assert 'thirty-five' in contract['purpose']
          contract['purpose']=contract['purpose'].replace('thirty-five','thirty-seven')
          contract['reviewed_announcement_exclusions'].update(expected_sha256=sha(EXCLUSION),expected_count=137)
          save(CONTRACT,contract)
          research['base_main_sha']=BASE
          research['current_g1_state'].update(public_exact_batch_count=33,exact_resolved_event_records=37,reviewed_excluded_event_records=137,note='The repository is at batch_0033; cumulative exact event records are 37 because some public batches resolve more than one historical event.')
          for r in candidates:
              research['validation_probes'].append(dict(probe_id=r['historical_symbol']+'-batch0033-resolved',event_id=r['event_id'],historical_symbol=r['historical_symbol'],historical_event_match=True,exact_clock_observed=True,exact_public_release_ts=r['public_announcement_ts'],timestamp_kind='first_public_release',timestamp_evidence_kind='publisher_timestamp',source_family='preserved_wire_mirror',source_reference=r['source_reference'],corroboration_reference=r['corroboration_reference'],source_grade='B',evidence_eligible=False,disposition='RESOLVED_IN_BATCH_0033',reason='Resolved by separately reviewed batch_0033 from preserved Marketwired article publication metadata; SEC content corroboration and mirror-clock limitation retained in the evidence dossier.'))
          save(RESEARCH,research)
          research_validator.validate_research_map(research,excluded)
          receipt_result=rebuild.rebuild(ROOT,publish=True)
          assert receipt_result['after']['up_to_date']
          manifest=acquisition.build_manifest()
          Path('data/public/metadata/g1_acquisition_manifest.json').write_text(acquisition.render_manifest(manifest),encoding='utf-8')
          assert manifest['state']['exact_resolved']==37 and manifest['state']['acquisition_needed']==137
          sprint.refresh_coverage(coverage_summary_path=COVERAGE,metadata_readiness_path=META/'metadata_readiness_summary.json',metadata_quality_path=META/'metadata_quality_summary.json',requirements_manifest_path=SPRINT/'requirements_manifest.json',unresolved_gates_path=COVERAGE.parent/'unresolved_gates.csv')
          status=sprint.build_status(requirements_manifest_path=SPRINT/'requirements_manifest.json',coverage_summary_path=COVERAGE,metadata_readiness_path=META/'metadata_readiness_summary.json',metadata_quality_path=META/'metadata_quality_summary.json',outpath=SPRINT/'step_status.json')
          assert next(r for r in status['steps'] if r['step']==9)['status']=='SOURCE_BLOCKED'
          assert status['all_12_genuinely_complete'] is False
          new_resolutions={r['event_id']:r for r in rows(META/'announcement_resolutions.csv')}
          assert rows_hash({k:v for k,v in new_resolutions.items() if k not in promoted})==unchanged_hash
          for r in candidates:
              actual=new_resolutions[r['event_id']]
              assert actual['resolution_status']=='resolved_exact_public_timestamp' and actual['source_grade']=='B'
              assert datetime.fromisoformat(actual['public_announcement_ts'].replace('Z','+00:00'))==datetime.fromisoformat(r['public_announcement_ts'])
          for name in ['tests/test_g1_source_research.py','tests/test_g1_acquisition_manifest.py']:
              path=Path(name); text=path.read_text()
              text=re.sub(r'== 35\b','== 37',text); text=re.sub(r'== 139\b','== 137',text)
              if name.endswith('test_g1_source_research.py'): text=text.replace('state["public_exact_batch_count"] == 32','state["public_exact_batch_count"] == 33')
              path.write_text(text,encoding='utf-8')
          path=Path('tests/test_real_data_release_sprint.py'); text=path.read_text()
          assert 'updated["missing_exact_announcement_timestamps"] == 139' in text
          path.write_text(text.replace('updated["missing_exact_announcement_timestamps"] == 139','updated["missing_exact_announcement_timestamps"] == 137'),encoding='utf-8')
          path=Path('tests/test_g1_public_batch_0032.py'); text=path.read_text()
          for old,new in [('== (35,139)','== (37,137)'),('len(excluded)==139','len(excluded)==137'),('"35/174" in step9["evidence"] and "139"','"37/174" in step9["evidence"] and "137"')]:
              assert old in text,old
              text=text.replace(old,new)
          path.write_text(text,encoding='utf-8')
          TEST.write_text('''from __future__ import annotations
          import copy
          import csv
          import hashlib
          import json
          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo
          import pytest
          import g1_source_research as validator
          ROOT=Path(__file__).resolve().parents[1]
          META=ROOT/"data/processed/authorized_input_real"
          DOSS=ROOT/"data/public/metadata/g1_announcement_times_batch_0033_evidence.json"
          def load(p): return json.loads(p.read_text())
          def rows(p):
              with p.open(newline="",encoding="utf-8") as f: return list(csv.DictReader(f))
          @pytest.mark.parametrize("event_id,symbol,lag",[("HEJFE-6C73B4B05384BC1E","PFPT",3900),("HEJFE-1FCAAB3F7CC931CF","VRSN",7080)])
          def test_reviewed_syndicated_clocks_resolve_exactly(event_id,symbol,lag):
              actual={r["event_id"]:r for r in rows(META/"announcement_resolutions.csv")}[event_id]
              e={r["event_id"]:r for r in rows(ROOT/"data/processed/historical_events.csv")}[event_id]
              release=datetime.fromisoformat(actual["public_announcement_ts"].replace("Z","+00:00"))
              trade=datetime.fromisoformat(e["first_documented_illicit_trade_ts"]).replace(tzinfo=ZoneInfo("America/New_York"))
              assert actual["historical_symbol"]==symbol
              assert actual["resolution_status"]=="resolved_exact_public_timestamp"
              assert actual["source_grade"]=="B"
              assert release==datetime.fromisoformat("2013-04-25T20:05:00+00:00")
              assert int((release-trade).total_seconds())==lag
              assert trade < release <= trade+timedelta(days=7)
          def test_evidence_retains_observed_metadata_and_mirror_limitations():
              d=load(DOSS); batch=ROOT/"data/public/metadata/g1_announcement_times_batch_0033.csv"
              assert hashlib.sha256(batch.read_bytes()).hexdigest()==d["batch_sha256"]
              assert len(rows(batch))==len(d["candidates"])==2
              for r in d["candidates"]:
                  assert r["evidence_source_family"]=="preserved_wire_mirror"
                  assert r["source_grade"]=="B"
                  assert r["original_wire_publisher_byline"]=="Marketwired"
                  assert r["observed_html_time_datetime"]=="2013-04-25T20:05:00+00:00"
                  assert r["visible_clock_observed"] is False
                  assert r["original_wire_source_link_observed"] is None
                  assert r["corroboration_reference"].startswith("https://www.sec.gov/Archives/")
                  assert datetime.fromisoformat(r["observed_html_time_datetime"])==datetime.fromisoformat(r["public_announcement_ts"])
          def test_all_non_promoted_resolution_rows_preserved():
              d=load(DOSS); promoted={r["event_id"] for r in d["candidates"]}
              remaining={r["event_id"]:r for r in rows(META/"announcement_resolutions.csv") if r["event_id"] not in promoted}
              digest=hashlib.sha256(json.dumps(remaining,sort_keys=True,separators=(",",":")).encode()).hexdigest()
              assert digest==d["non_promoted_resolution_rows_sha256"]
              assert hashlib.sha256((ROOT/"data/processed/historical_events.csv").read_bytes()).hexdigest()==d["frozen_events_sha256"]
          def test_current_receipts_reconcile_without_completing_step9():
              r=load(META/"metadata_readiness_summary.json")
              assert (r["event_count"],r["announcement_exact_resolved"],r["announcement_events_excluded"],r["announcement_unresolved"])==(174,37,137,0)
              assert r["ready_g1_exact_timing_analysis"] is False
              excluded=[x for x in rows(META/"announcement_resolutions.csv") if x["resolution_status"]=="excluded_fail_closed"]
              assert len(excluded)==137
              assert all(not x["public_announcement_ts"] and not x.get("information_asymmetry_seconds") for x in excluded)
              status=load(ROOT/"data/processed/real_data_release_sprint/step_status.json")
              step9=next(x for x in status["steps"] if x["step"]==9)
              assert step9["status"]=="SOURCE_BLOCKED"
              assert "37/174" in step9["evidence"] and "137" in step9["evidence"]
              assert status["all_12_genuinely_complete"] is False
          @pytest.mark.parametrize("mutation,match",[("missing_corroboration","corroboration_reference"),("date_only","timezone-aware"),("capture_time","timestamp_evidence_kind")])
          def test_batch_specific_invalid_evidence_stays_rejected(mutation,match):
              r=load(DOSS)["candidates"][0]
              exclusions={r["event_id"]:{"historical_symbol":r["historical_symbol"],"first_documented_illicit_trade_ts":r["first_trade"]}}
              p=dict(probe_id="batch0033-negative",event_id=r["event_id"],historical_symbol=r["historical_symbol"],historical_event_match=True,exact_clock_observed=True,exact_public_release_ts=r["public_announcement_ts"],timestamp_kind="first_public_release",timestamp_evidence_kind="publisher_timestamp",source_family="preserved_wire_mirror",source_reference=r["source_reference"],corroboration_reference=r["corroboration_reference"])
              if mutation=="missing_corroboration": p.pop("corroboration_reference")
              elif mutation=="date_only": p["exact_public_release_ts"]="2013-04-25"
              else: p["timestamp_evidence_kind"]="archive_capture_time"
              with pytest.raises(validator.G1SourceResearchError,match=match): validator._validate_evidence_eligible_probe(p,exclusions)
          ''',encoding='utf-8')
          path=Path('docs/g1_announcement_times.md'); text=path.read_text()
          assert '**32 public exact-time batches / 35 exact-resolved' in text
          text=text.replace('**32 public exact-time batches / 35 exact-resolved','**33 public exact-time batches / 37 exact-resolved')
          text+='\n### Batch 0033: Proofpoint and VeriSign syndicated release clocks\n\nBoth April 25, 2013 Marketwired-attributed Yahoo Finance press releases preserve an HTML time datetime value of 2013-04-25T20:05:00+00:00, equivalent to 16:05 EDT. Matching SEC exhibits independently corroborate the release identity, date and results, not the clock. Grade B explicitly records that the observed clocks are from syndicated copies; no original-wire source link was observed, and the visible page text shows the date only. The clock was read from article publication metadata, not inferred from the URL or the separate 16:30 conference-call time. Evidence and observations are retained in `data/public/metadata/g1_announcement_times_batch_0033_evidence.json`. Current cumulative state is 37 exact / 137 reviewed exclusions; Step 9 remains SOURCE_BLOCKED.\n'
          path.write_text(text,encoding='utf-8')
          path=Path('docs/g1_final_timing_exclusions.md'); lines=path.read_text().splitlines(True)
          for i,line in enumerate(lines[:20]):
              if 'Exact first-public announcement timestamps resolved' in line or 'Events eligible for exact' in line: lines[i]=line.replace('35','37')
              if 'Immutable reviewed fail-closed exclusions' in line: lines[i]=line.replace('139','137')
          path.write_text(''.join(lines)+'\n## Public syndicated-clock batch 0033\n\nProofpoint and VeriSign leave the exclusion set after review of the Marketwired-attributed publication metadata and matching SEC release exhibits. Grade B and mirror-clock limitations are retained. The remaining 137 events have no accepted exact release clocks and stay excluded from timing-dependent analysis.\n',encoding='utf-8')
          assert sha('data/processed/historical_events.csv')==FROZEN
          subprocess.run(['git','rm',TEMP_WORKFLOW],check=True)
          existing=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          new_paths=[str(BATCH),str(EVIDENCE),str(TEST)]
          changed=sorted(set(existing+new_paths))
          allowed=('config/metadata_sources.public_progress.json','data/processed/authorized_input_real/','data/processed/real_data_replay/real_data_replay_status.json','data/processed/research_receipt_bundle.json','data/processed/coverage_plan_real/','data/processed/real_data_release_sprint/step_status.json','data/public/metadata/','docs/g1_','tests/test_g1_','tests/test_real_data_release_sprint.py')
          assert all(p.startswith(allowed) for p in changed),changed
          allowpath=Path('config/release_drift_allowlist.json'); allow=load(allowpath)
          for name in changed:
              sections=[s for s in ['intentional_release_modifications','repository_additions'] if name in allow[s]]
              assert len(sections)==1 or name in new_paths,name
              section=sections[0] if sections else 'repository_additions'
              allow[section][name]=dict(expected_sha256=sha(name),reason='Reviewed public batch 0033: two Grade B Marketwired syndicated publication clocks with SEC identity corroboration; deterministic 37 exact / 137 reviewed-exclusion receipts and focused regressions. No runtime gate change.')
          save(allowpath,allow)
          subprocess.run(['git','add','--',*changed,str(allowpath)],check=True)
          audit=Path('private_runtime/audit/g1-public-batch-0033'); audit.mkdir(parents=True,exist_ok=True)
          receipt=dict(base_main_sha=BASE,exact_before=35,exact_after=37,excluded_after=137,step9_status='SOURCE_BLOCKED',source_grade='B',changed_paths=changed,batch_sha256=sha(BATCH),evidence_sha256=sha(EVIDENCE),frozen_events_sha256=FROZEN,unchanged_rows=172,non_promoted_resolution_rows_sha256=unchanged_hash)
          save(audit/'build_receipt.json',receipt)
          (audit/'candidate.patch').write_bytes(subprocess.check_output(['git','diff','--cached','--binary']))
          print(json.dumps(receipt,indent=2))
          PY
      - name: Harden test runtime permissions
        run: python -m deployment_hardening harden-permissions --config config/runtime.demo.toml
      - name: Verify focused evidence, deterministic receipts and drift
        run: |
          python -m pytest -q tests/test_g1_public_batch_0033.py tests/test_g1_public_batch_0032.py tests/test_g1_source_research.py tests/test_g1_acquisition_manifest.py tests/test_real_data_release_sprint.py tests/test_research_receipt_rebuild.py tests/test_release_drift.py --junitxml=private_runtime/audit/g1-public-batch-0033/focused-junit.xml
          python -m research_receipt_rebuild --check
          python -m g1_acquisition_manifest --check
      - name: Publish generated candidate to this branch only
        run: |
          test "$GITHUB_REF" = refs/heads/data/g1-public-batch-0033-pfpt-vrsn
          git diff --exit-code
          git config user.name 'G1 public evidence builder'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'G1: recover Proofpoint and VeriSign; rebuild 37-of-174 receipts'
          git push origin HEAD:refs/heads/data/g1-public-batch-0033-pfpt-vrsn
      - name: Retain build and focused-test evidence
