name: g3-public-listing-build

on:
  push:
    branches:
      - fix/g3-primary-listing-history

permissions:
  contents: write

concurrency:
  group: g3-public-listing-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[g3-generated]')"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Build pinned public listing evidence
        run: |
          python src/g3_listing_evidence.py \
            --events data/processed/historical_events.csv \
            --supplement data/public/metadata/g3_listing_supplement.csv \
            --output data/public/metadata/g3_primary_listing_history.csv \
            --report data/processed/g3_listing_evidence_report.json

      - name: Run production metadata resolver
        run: |
          python src/metadata_resolver.py \
            --events data/processed/historical_events.csv \
            --symbol-dates data/processed/coverage_plan_real/symbol_date_requirements.csv \
            --contract config/metadata_sources.g3_public.json \
            --outdir data/processed/metadata_resolution_real

      - name: Run metadata quality audit
        run: |
          python src/metadata_quality.py \
            --events data/processed/historical_events.csv \
            --symbol-dates data/processed/coverage_plan_real/symbol_date_requirements.csv \
            --contract config/metadata_sources.g3_public.json \
            --resolver-dir data/processed/metadata_resolution_real \
            --outdir data/processed/metadata_quality_real

      - name: Commit generated G3 evidence and receipts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/public/metadata/g3_primary_listing_history.csv \
            data/processed/g3_listing_evidence_report.json \
            data/processed/metadata_resolution_real \
            data/processed/metadata_quality_real
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "[g3-generated] build point-in-time primary listing evidence"
          git push origin HEAD:fix/g3-primary-listing-history
