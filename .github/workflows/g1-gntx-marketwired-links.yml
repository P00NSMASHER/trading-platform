name: G1 GNTX Marketwired related links
on:
  push:
    branches: [g1/research-gntx-marketwired-links]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Extract related links from archived Oct 8 release
        run: |
          python - <<'PY'
          import urllib.request,gzip,re,html
          fn="crawl-data/CC-MAIN-2013-48/segments/1386164039245/warc/CC-MAIN-20131204133359-00010-ip-10-33-133-15.ec2.internal.warc.gz"
          off=444354174;ln=11999
          req=urllib.request.Request("https://data.commoncrawl.org/"+fn,headers={"Range":f"bytes={off}-{off+ln-1}","User-Agent":"G1-public-research/1.0"})
          data=urllib.request.urlopen(req,timeout=30).read()
          try:data=gzip.decompress(data)
          except:pass
          txt=data.decode("utf-8","replace")
          print("LEN",len(txt))
          for href in re.findall(r'href=["\']([^"\']+)["\']',txt,re.I):
            h=html.unescape(href)
            if "gentex" in h.lower() or "gntx" in h.lower() or "marketwired" in h.lower():
              print("LINK",h)
          plain=html.unescape(re.sub(r"<[^>]+>"," ",txt));plain=re.sub(r"\s+"," ",plain)
          for needle in ["third quarter 2013","financial results","related"]:
            i=plain.lower().find(needle)
            if i>=0: print("CTX",needle,plain[max(0,i-1000):i+3000])
          PY
