name: dashboard-live-receipts-bind

on:
  push:
    branches: [dashboard/live-readiness-receipts]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dashboard-live-receipts-bind
  cancel-in-progress: true

jobs:
  bind:
    if: "!contains(github.event.head_commit.message, '[dashboard-receipts-generated]')"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}

      - name: Verify dashboard receipt contract
        run: python -m pytest -q tests/test_public_dashboard.py

      - name: Bind hashes into release drift
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          allow=Path("config/release_drift_allowlist.json")
          obj=json.loads(allow.read_text(encoding="utf-8"))
          manifest=json.loads(Path("RELEASE_MANIFEST.json").read_text(encoding="utf-8"))
          release_paths={str(x["path"]) for x in manifest.get("files",[])}
          reason=(
              "Public research dashboard now hydrates machine-readable software-readiness and replay receipts "
              "with no-store fetches, while retaining a fail-closed static fallback and embedding no vendor secrets."
          )
          paths=["dashboard/index.html","tests/test_public_dashboard.py"]

          def sha(path):
              h=hashlib.sha256()
              with Path(path).open("rb") as f:
                  for chunk in iter(lambda:f.read(1024*1024),b""):
                      h.update(chunk)
              return h.hexdigest()

          mods=obj["intentional_release_modifications"]
          adds=obj["repository_additions"]
          for path in paths:
              detail={"expected_sha256":sha(path),"reason":reason}
              mods.pop(path,None); adds.pop(path,None)
              if path in release_paths:
                  mods[path]=detail
              else:
                  adds[path]=detail
          allow.write_text(json.dumps(obj,indent=2)+"\n",encoding="utf-8")
          PY

      - name: Commit release-drift binding
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/release_drift_allowlist.json
          git commit -m "[dashboard-receipts-generated] bind live dashboard hashes"
          git push origin HEAD:dashboard/live-readiness-receipts
