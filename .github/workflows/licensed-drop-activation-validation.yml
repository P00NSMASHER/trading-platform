name: licensed-drop-activation-validation

on:
  push:
    branches: [release/licensed-drop-activation]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: licensed-drop-activation-validation
  cancel-in-progress: true

jobs:
  validate:
    if: "!contains(github.event.head_commit.message, '[licensed-drop-generated]')"
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade "pip==26.2.1"
          python -m pip install -r requirements.lock
          python -m pip install -r requirements-dev.lock

      - name: Harden ephemeral runtime permissions
        run: |
          mkdir -p private_runtime/audit private_runtime/backups private_runtime/exports
          chmod 700 private_runtime/audit private_runtime/backups private_runtime/exports
          chmod 600 config/runtime.demo.toml
          chmod 600 data/processed/case_demo/cases.sqlite
          chmod 600 data/processed/model_demo/model_bundle.joblib
          chmod 600 data/processed/model_demo/training_manifest.json

      - name: Focused activation tests
        run: |
          python -m pytest -q             tests/test_licensed_data_intake.py             tests/test_licensed_data_drop_processor.py             tests/test_real_data_replay.py             tests/test_real_data_release_sprint.py

      - name: Run software readiness certification
        run: |
          python src/software_readiness_certification.py             --root .             --runtime-config config/runtime.demo.toml             --output data/processed/software_readiness/software_readiness_certification.json             --require-software-ready

      - name: Assert certification semantics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("data/processed/software_readiness/software_readiness_certification.json")
          x=json.loads(p.read_text())
          assert x["software_ready"] is True
          assert x["overall_status"] == "SOFTWARE_READY_REAL_DATA_PENDING"
          assert x["real_data_validated"] is False
          assert "tests/test_licensed_data_drop_processor.py" in x["hostile_regression_suite"]["test_files"]
          assert "src/licensed_data_drop_processor.py" not in [
              c["detail"] for c in x["checks"] if c["check_id"]=="SOFTWARE_COMPONENTS"
          ]
          print(json.dumps({
              "status":x["overall_status"],
              "passed":x["hostile_regression_suite"]["passed_count"],
              "software_failures":x["software_failure_count"],
          }, indent=2))
          PY

      - name: Bind release drift hashes
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          p=Path("config/release_drift_allowlist.json")
          obj=json.loads(p.read_text(encoding="utf-8"))
          release=json.loads(Path("RELEASE_MANIFEST.json").read_text(encoding="utf-8"))
          release_paths={str(x["path"]) for x in release.get("files",[])}

          reason=(
              "Licensed-data private-drop activation: exact SHA-256 entitlement binding, "
              "fail-closed authorization activation, bounded watcher, replay handoff, hostile tests, "
              "and software-readiness certification."
          )
          paths=[
              "src/licensed_data_drop_processor.py",
              "tests/test_licensed_data_drop_processor.py",
              "config/licensed_entitlement_manifest.example.json",
              "docs/licensed_data_drop_activation.md",
              "src/software_readiness_certification.py",
              "data/processed/software_readiness/software_readiness_certification.json",
          ]

          def sha(path):
              h=hashlib.sha256()
              with Path(path).open("rb") as f:
                  for chunk in iter(lambda:f.read(1024*1024),b""):
                      h.update(chunk)
              return h.hexdigest()

          mods=obj["intentional_release_modifications"]
          adds=obj["repository_additions"]
          for path in paths:
              detail={"expected_sha256":sha(path),"reason":reason}
              mods.pop(path,None)
              adds.pop(path,None)
              if path in release_paths:
                  mods[path]=detail
              else:
                  adds[path]=detail

          p.write_text(json.dumps(obj,indent=2)+"\n",encoding="utf-8")
          PY

      - name: Run release drift tests after binding
        run: |
          python -m pytest -q tests/test_release_drift.py tests/test_secret_scan.py

      - name: Commit generated certification and drift bindings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             config/release_drift_allowlist.json             data/processed/software_readiness/software_readiness_certification.json
          git commit -m "[licensed-drop-generated] bind activation hashes and recertify"
          git push origin HEAD:release/licensed-drop-activation
