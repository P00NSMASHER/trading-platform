name: G1 GNTX ADVFN timestamp research
on:
  push:
    branches: [g1/research-gntx-advfn]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Inspect ADVFN historical news routes
        run: |
          python - <<'PY'
          import urllib.request,re,html,urllib.parse
          ua={"User-Agent":"Mozilla/5.0"}
          urls=[
            "https://uk.advfn.com/stock-market/NASDAQ/GNTX/news?date=20131022",
            "https://au.advfn.com/stock-market/NASDAQ/GNTX/news?date=20131022",
            "https://www.advfn.com/stock-market/NASDAQ/GNTX/news?date=20131022",
            "https://uk.advfn.com/p.php?pid=news&symbol=NASDAQ%5EGNTX&date=20131022",
            "https://au.advfn.com/p.php?pid=news&symbol=NASDAQ%5EGNTX&date=20131022",
          ]
          for url in urls:
            try:
              req=urllib.request.Request(url,headers=ua)
              raw=urllib.request.urlopen(req,timeout=15).read().decode("utf-8","replace")
              plain=html.unescape(re.sub(r"<[^>]+>"," ",raw));plain=re.sub(r"\s+"," ",plain)
              print("URL",url,"LEN",len(raw))
              i=plain.lower().find("gentex reports third quarter 2013 financial results")
              if i>=0: print("FOUND",plain[max(0,i-1000):i+2500])
              for m in re.finditer(r'(?i).{0,200}(?:Custom Date|name="date"|20131022).{0,300}',raw):
                print("FORM",re.sub(r"\s+"," ",m.group(0))[:700])
            except Exception as e: print("ERR",url,repr(e))
          PY
