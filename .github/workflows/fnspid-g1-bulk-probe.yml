name: FNSPID G1 bulk probe
on:
  push:
    branches:
      - g1/fnspid-bulk-probe
permissions:
  contents: read
concurrency:
  group: fnspid-g1-bulk-probe
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Stream FNSPID news and filter remaining G1 windows
        shell: bash
        run: |
          set -o pipefail
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://huggingface.co/datasets/khaihernlow/fnspid/resolve/main/Stock_news/All_external.jsonl?download=true' \
            | python scripts/fnspid_g1_probe.py
      - name: Upload filtered discovery leads
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fnspid-g1-bulk-probe-${{ github.sha }}
          path: private_runtime/audit/fnspid-bulk-probe
          if-no-files-found: warn
          retention-days: 7
