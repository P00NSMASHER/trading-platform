name: skops-015-security-validation

on:
  push:
    branches: [maintenance/skops-015-security]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: skops-015-security-validation
  cancel-in-progress: true

jobs:
  validate:
    if: "!contains(github.event.head_commit.message, '[skops-015-generated]')"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: Install core and safer-model locks
        run: |
          python -m pip install --upgrade "pip==26.2.1"
          python -m pip install -r requirements.lock
          python -m pip install -r requirements-dev.lock
          python -m pip install -r requirements-skops.lock

      - name: Harden ephemeral runtime permissions
        run: |
          mkdir -p private_runtime/audit private_runtime/backups private_runtime/exports
          chmod 700 private_runtime/audit private_runtime/backups private_runtime/exports
          chmod 600 config/runtime.demo.toml
          chmod 600 data/processed/case_demo/cases.sqlite
          chmod 600 data/processed/model_demo/model_bundle.joblib
          chmod 600 data/processed/model_demo/training_manifest.json

      - name: Assert exact skops version
        run: |
          python - <<'PY'
          import skops
          assert skops.__version__ == "0.15.0", skops.__version__
          print(skops.__version__)
          PY

      - name: Run model artifact and deployment tests
        run: |
          python -m pytest -q tests/test_model_artifact.py tests/test_deployment_hardening.py

      - name: Exercise real champion skops export and inspection
        run: |
          python src/model_artifact.py export-skops \
            --source-joblib data/processed/model_demo/model_bundle.joblib \
            --expected-joblib-sha256 0c8c16c9be734152c0018aa40e576fe4db9f4621359fafe521465890f9945616 \
            --output-skops /tmp/champion.skops \
            --inspection-report /tmp/champion-skops-inspection.json
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          p=Path("/tmp/champion.skops")
          r=json.loads(Path("/tmp/champion-skops-inspection.json").read_text())
          assert p.exists() and p.stat().st_size > 0
          assert r["target_format"] == "skops"
          assert r["source_sha256"] == "0c8c16c9be734152c0018aa40e576fe4db9f4621359fafe521465890f9945616"
          assert r["output_sha256"] == hashlib.sha256(p.read_bytes()).hexdigest()
          assert r["explicit_type_review_required"] == bool(r["untrusted_types"])
          assert r["runtime_load_permitted"] == (not bool(r["untrusted_types"]))
          print(json.dumps(r, indent=2))
          PY

      - name: Bind dependency hashes into release drift allowlist
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          p=Path("config/release_drift_allowlist.json")
          obj=json.loads(p.read_text(encoding="utf-8"))
          manifest=json.loads(Path("RELEASE_MANIFEST.json").read_text(encoding="utf-8"))
          release_paths={str(x["path"]) for x in manifest.get("files",[])}
          reason=(
            "Security maintenance: require skops 0.15.x for the optional safer-model path, "
            "validated with actual champion export/inspection and fail-closed artifact tests."
          )
          paths=["pyproject.toml","requirements-skops.lock","tests/test_deployment_hardening.py"]
          def sha(path):
              h=hashlib.sha256()
              with Path(path).open("rb") as f:
                  for chunk in iter(lambda:f.read(1024*1024),b""):
                      h.update(chunk)
              return h.hexdigest()
          mods=obj["intentional_release_modifications"]
          adds=obj["repository_additions"]
          for path in paths:
              detail={"expected_sha256":sha(path),"reason":reason}
              mods.pop(path,None); adds.pop(path,None)
              if path in release_paths:
                  mods[path]=detail
              else:
                  adds[path]=detail
          p.write_text(json.dumps(obj,indent=2)+"\n",encoding="utf-8")
          PY

      - name: Commit bound hashes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/release_drift_allowlist.json
          git commit -m "[skops-015-generated] bind security dependency hashes"
          git push origin HEAD:maintenance/skops-015-security
