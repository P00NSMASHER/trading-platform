name: G1 Business Wire bulk timestamp scan
on:
  push:
    branches:
      - g1/businesswire-bulk-timestamp-scan
permissions:
  contents: write
concurrency:
  group: g1-businesswire-bulk-timestamp-scan
  cancel-in-progress: false
jobs:
  scan:
    if: github.repository == 'P00NSMASHER/trading-platform' && !contains(github.event.head_commit.message, '[bw-scan-generated]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Scan exact Business Wire URLs
        run: python scripts/g1_businesswire_bulk_timestamp_scan.py
      - name: Publish research report to branch
        run: |
          test "$GITHUB_REF_NAME" = 'g1/businesswire-bulk-timestamp-scan'
          test "$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/public/metadata/g1_businesswire_bulk_timestamp_scan.json
          if git diff --cached --quiet; then
            echo "No report changes"
          else
            git commit -m 'G1: publish Business Wire bulk timestamp scan [bw-scan-generated]'
            git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          fi
