name: Import Step 21 package

on:
  push:
    branches: [import-step21]
    paths:
      - bootstrap/READY

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble and verify package
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f bootstrap/READY ]]; then
            echo "READY sentinel absent; nothing to import."
            exit 0
          fi
          cat bootstrap/step21.part*.b64 | base64 --decode > /tmp/MNPI_Prototype_Step21.zip
          echo "33ed148d480808474b6aab6c958aa476e6fe73be5a9eeb467e156ec88f3b4158  /tmp/MNPI_Prototype_Step21.zip" | sha256sum -c -

      - name: Safely unpack package into repository
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os, shutil, zipfile

          repo = Path.cwd()
          zp = Path("/tmp/MNPI_Prototype_Step21.zip")
          tmp = Path("/tmp/step21_extract")
          wrapper = "mnpi_surveillance_private_step21_work"

          if tmp.exists():
              shutil.rmtree(tmp)
          tmp.mkdir(parents=True)

          with zipfile.ZipFile(zp) as z:
              for info in z.infolist():
                  normalized = os.path.normpath(info.filename)
                  if os.path.isabs(normalized) or normalized == ".." or normalized.startswith("../"):
                      raise SystemExit(f"unsafe archive path: {info.filename}")
              z.extractall(tmp)

          src = tmp / wrapper
          if not src.is_dir():
              raise SystemExit("expected Step 21 wrapper directory is missing")

          for item in src.iterdir():
              if item.name == ".git":
                  continue
              dest = repo / item.name
              if item.is_dir():
                  shutil.copytree(item, dest, dirs_exist_ok=True)
              else:
                  shutil.copy2(item, dest)

          release_dir = repo / "releases"
          release_dir.mkdir(exist_ok=True)
          shutil.copy2(zp, release_dir / "MNPI_Prototype_Step21.zip")
          PY

      - name: Record import provenance
        shell: bash
        run: |
          cat > STEP21_IMPORT.md <<'EOF'
          # Step 21 Import Provenance

          Imported from the validated private prototype package.

          - Package: `MNPI_Prototype_Step21.zip`
          - Package SHA-256: `33ed148d480808474b6aab6c958aa476e6fe73be5a9eeb467e156ec88f3b4158`
          - Frozen champion SHA-256: `0c8c16c9be734152c0018aa40e576fe4db9f4621359fafe521465890f9945616`
          - Local validation before import: `183 passed`
          - Internal package SHA256SUMS verification: PASS
          - Credential-pattern scan before import: no matches found
          - Step 21 remains historical surveillance research only; evaluation release remains fail-closed.

          `FROZEN_CHAMPION.md` is intentionally preserved from repository initialization.
          EOF
          rm -rf bootstrap

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import validated Step 21 prototype" || exit 0
          git push origin HEAD:import-step21
