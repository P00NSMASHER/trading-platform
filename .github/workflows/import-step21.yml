name: Import Step 21 package

on:
  push:
    branches: [import-step21]
    paths:
      - bootstrap/READY

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble and verify private transfer archive
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f bootstrap/READY ]]; then
            echo "READY sentinel absent; nothing to import."
            exit 0
          fi
          cat bootstrap/step21.part*.b64 | base64 --decode > /tmp/step21.tar.xz
          echo "c69137181d890425b3e43cf999cb06a381d25f1b96e3480cf23557bd1d3633f0  /tmp/step21.tar.xz" | sha256sum -c -

      - name: Safely unpack package into repository
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/step21_extract
          mkdir -p /tmp/step21_extract

          python - <<'PY'
          import subprocess
          names = subprocess.check_output(
              ["tar", "-tJf", "/tmp/step21.tar.xz"],
              text=True,
          ).splitlines()
          for name in names:
              cleaned = name.rstrip("/")
              if not cleaned:
                  continue
              if cleaned.startswith("/") or any(part == ".." for part in cleaned.split("/")):
                  raise SystemExit(f"unsafe archive path: {name}")
          PY

          tar -xJf /tmp/step21.tar.xz -C /tmp/step21_extract
          src=/tmp/step21_extract/mnpi_surveillance_private_step21_work
          test -d "$src"

          shopt -s dotglob nullglob
          for item in "$src"/*; do
            name="$(basename "$item")"
            [[ "$name" == ".git" ]] && continue
            rm -rf "./$name"
            cp -a "$item" "./$name"
          done

      - name: Record import provenance
        shell: bash
        run: |
          cat > STEP21_IMPORT.md <<'EOF'
          # Step 21 Import Provenance

          Imported from the validated private Step 21 prototype supplied in ChatGPT.

          - Original package: `MNPI_Prototype_Step21.zip`
          - Original package SHA-256: `33ed148d480808474b6aab6c958aa476e6fe73be5a9eeb467e156ec88f3b4158`
          - Private transfer archive SHA-256: `c69137181d890425b3e43cf999cb06a381d25f1b96e3480cf23557bd1d3633f0`
          - Frozen champion SHA-256: `0c8c16c9be734152c0018aa40e576fe4db9f4621359fafe521465890f9945616`
          - Local validation before import: `183 passed`
          - Original package internal SHA256SUMS verification: PASS
          - Credential-pattern scan before import: no obvious embedded credentials found
          - Evaluation release remains fail-closed.

          `FROZEN_CHAMPION.md` is intentionally preserved as repository-level baseline evidence.
          EOF
          rm -rf bootstrap

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import validated Step 21 prototype" || exit 0
          git push origin HEAD:import-step21
