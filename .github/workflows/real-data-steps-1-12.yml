name: real-data-steps-1-12

on:
  push:
    branches: [release/real-data-steps-1-12]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: real-data-steps-1-12
  cancel-in-progress: true

jobs:
  sprint:
    if: "!contains(github.event.head_commit.message, '[real-data-sprint-generated]')"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade "pip==26.2.1"
          python -m pip install -r requirements.lock
          python -m pip install -r requirements-dev.lock

      - name: Step 1-2 freeze requirements and contract blueprint
        run: |
          python -m real_data_release_sprint freeze \
            --source-date-requirements data/processed/coverage_plan_real/source_date_requirements.csv \
            --event-exchange-resolutions data/processed/authorized_input_real/event_exchange_resolutions.csv \
            --outdir data/processed/real_data_release_sprint

      - name: Step 3-8 validate installed ingestion pipelines
        run: |
          python src/historical_market_backfill.py validate-contract \
            --contract config/historical_market_sources.example.json
          python -m pytest -q \
            tests/test_historical_market_backfill.py \
            tests/test_market_data_adapter.py \
            tests/test_coverage_planner.py \
            tests/test_matched_control_generator.py

      - name: Refresh current top-level coverage gates
        run: |
          python -m real_data_release_sprint refresh-coverage \
            --coverage-summary data/processed/coverage_plan_real/coverage_summary.json \
            --metadata-readiness data/processed/authorized_input_real/metadata_readiness_summary.json \
            --metadata-quality data/processed/authorized_input_real/metadata_quality_summary.json \
            --requirements-manifest data/processed/real_data_release_sprint/requirements_manifest.json \
            --unresolved-gates data/processed/coverage_plan_real/unresolved_gates.csv

      - name: Execute Steps 1-12 truth audit
        run: |
          python -m real_data_release_sprint status \
            --requirements-manifest data/processed/real_data_release_sprint/requirements_manifest.json \
            --coverage-summary data/processed/coverage_plan_real/coverage_summary.json \
            --metadata-readiness data/processed/authorized_input_real/metadata_readiness_summary.json \
            --metadata-quality data/processed/authorized_input_real/metadata_quality_summary.json \
            --out data/processed/real_data_release_sprint/step_status.json
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("data/processed/real_data_release_sprint/step_status.json").read_text())
          by={x["step"]:x["status"] for x in s["steps"]}
          assert [by[i] for i in (1,2,3,4,6)] == ["PASS"]*5, by
          assert [by[i] for i in (5,7,8,9,10)] == ["SOURCE_BLOCKED"]*5, by
          assert [by[i] for i in (11,12)] == ["DEPENDENCY_BLOCKED"]*2, by
          assert s["all_12_genuinely_complete"] is False
          print(json.dumps(s,indent=2))
          PY

      - name: Regression tests for gates and release locks
        run: |
          python -m pytest -q \
            tests/test_real_data_release_sprint.py \
            tests/test_metadata_resolver.py \
            tests/test_metadata_quality.py \
            tests/test_evaluation_release_controller.py

      - name: Update reviewed release-drift hashes
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          p=Path("config/release_drift_allowlist.json")
          obj=json.loads(p.read_text(encoding="utf-8"))
          manifest=json.loads(Path("RELEASE_MANIFEST.json").read_text(encoding="utf-8"))
          release_paths={str(x["path"]) for x in manifest.get("files",[])}
          reason=(
            "Real-data Steps 1-12 sprint: freeze exact G2 requirements, install a production source-contract blueprint, "
            "verify ingestion pipelines, condition ITCH on G3-confirmed Nasdaq events, refresh stale top-level gates, "
            "and record source-dependent steps fail-closed without synthetic substitution."
          )
          paths=[
            "src/real_data_release_sprint.py",
            "tests/test_real_data_release_sprint.py",
            "docs/real_data_release_sprint.md",
            "data/processed/coverage_plan_real/coverage_summary.json",
            "data/processed/coverage_plan_real/unresolved_gates.csv",
            "data/processed/real_data_release_sprint/requirements_manifest.json",
            "data/processed/real_data_release_sprint/g2_core_source_date_requirements.csv",
            "data/processed/real_data_release_sprint/g2_option_source_date_requirements.csv",
            "data/processed/real_data_release_sprint/g2_itch_event_requirements.csv",
            "data/processed/real_data_release_sprint/market_source_inventory.template.csv",
            "data/processed/real_data_release_sprint/production_source_contract_blueprint.json",
            "data/processed/real_data_release_sprint/step_status.json",
          ]
          def sha(path):
              h=hashlib.sha256()
              with Path(path).open("rb") as f:
                  for chunk in iter(lambda:f.read(1024*1024),b""):
                      h.update(chunk)
              return h.hexdigest()
          mods=obj["intentional_release_modifications"]
          adds=obj["repository_additions"]
          for path in paths:
              detail={"expected_sha256":sha(path),"reason":reason}
              mods.pop(path,None); adds.pop(path,None)
              if path in release_paths:
                  mods[path]=detail
              else:
                  adds[path]=detail
          p.write_text(json.dumps(obj,indent=2)+"\n",encoding="utf-8")
          PY

      - name: Commit generated sprint receipts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            config/release_drift_allowlist.json \
            data/processed/coverage_plan_real/coverage_summary.json \
            data/processed/coverage_plan_real/unresolved_gates.csv \
            data/processed/real_data_release_sprint
          git commit -m "[real-data-sprint-generated] execute Steps 1-12 truth audit"
          git push origin HEAD:release/real-data-steps-1-12
