name: g4-final-blocker-dossier-allowlist

on:
  push:
    branches: [docs/g4-final-blocker-dossier]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: g4-final-blocker-dossier-allowlist
  cancel-in-progress: true

jobs:
  bind:
    if: "!contains(github.event.head_commit.message, '[g4-blocker-dossier-bound]')"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - name: Bind blocker dossier hashes
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          p=Path("config/release_drift_allowlist.json")
          obj=json.loads(p.read_text(encoding="utf-8"))
          reason="G4 final blocker dossier: durable audit record for the 18 remaining fail-closed shares observations after exhaustive pre-cutoff evidence research."
          paths=[
            "data/processed/authorized_input_real/g4_final_blockers.json",
            "docs/g4_final_blockers.md",
          ]
          def sha(path):
              h=hashlib.sha256()
              with Path(path).open("rb") as f:
                  for chunk in iter(lambda:f.read(1024*1024),b""):
                      h.update(chunk)
              return h.hexdigest()
          adds=obj["repository_additions"]
          for path in paths:
              adds[path]={"expected_sha256":sha(path),"reason":reason}
          p.write_text(json.dumps(obj,indent=2)+"\n",encoding="utf-8")
          PY
      - name: Commit reviewed hashes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/release_drift_allowlist.json
          git commit -m "[g4-blocker-dossier-bound] bind final blocker evidence"
          git push origin HEAD:docs/g4-final-blocker-dossier
