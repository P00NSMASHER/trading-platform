name: g4-wll-drift-review

on:
  push:
    branches:
      - g4/wll-exact-rebased

permissions:
  contents: write

jobs:
  review-drift:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: g4/wll-exact-rebased
          fetch-depth: 0
          persist-credentials: true
      - name: Update reviewed drift identities
        shell: python
        run: |
          import hashlib, json, subprocess
          from pathlib import Path

          root = Path(".")
          subprocess.run(["git","fetch","origin","main"], check=True)
          changed = subprocess.check_output(
              ["git","diff","--name-only","origin/main...HEAD"], text=True
          ).splitlines()
          skip = {
              "config/release_drift_allowlist.json",
              ".github/workflows/g4-wll-drift-review.yml",
          }
          paths = [p for p in changed if p not in skip and (root/p).is_file()]
          allow_path = root/"config/release_drift_allowlist.json"
          allow = json.loads(allow_path.read_text())
          reason = (
              "G4 exact WLL repair: official SEC Form 8-K accession "
              "0001193125-15-001735 supplies 166,889,152 post-Kodiak shares "
              "outstanding as of 2014-12-31, public 2015-01-05 16:02:59 ET; "
              "canonical receipts regenerated, residual exact-completion scope "
              "reduced to ACO x10 + CGNX x5, with no lookahead or inferred totals."
          )
          mods = allow["intentional_release_modifications"]
          adds = allow["repository_additions"]
          for p in paths:
              digest = hashlib.sha256((root/p).read_bytes()).hexdigest()
              if p in mods:
                  mods[p]["expected_sha256"] = digest
                  mods[p]["reason"] = reason
              elif p in adds:
                  adds[p]["expected_sha256"] = digest
                  adds[p]["reason"] = reason
              else:
                  adds[p] = {"expected_sha256": digest, "reason": reason}
          allow["intentional_release_modifications"] = dict(sorted(mods.items()))
          allow["repository_additions"] = dict(sorted(adds.items()))
          allow_path.write_text(json.dumps(allow, indent=2) + "\n")
          print(json.dumps({"reviewed_paths": paths}, indent=2))
      - name: Commit reviewed drift ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/release_drift_allowlist.json
          git commit -m "G4: review WLL exact-repair release drift"
          git push origin HEAD:g4/wll-exact-rebased
