name: synthetic-ci

# This workflow stays manual because release-drift verification requires an
# independently recorded SHA-256 trust root supplied at dispatch time.
on:
  workflow_dispatch:
    inputs:
      release_drift_trust_root_sha256:
        description: "Independently recorded SHA-256 of config/release_drift_allowlist.json"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: synthetic-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Synthetic-only tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade "pip==26.2.1"
          python -m pip install -r requirements.lock
          python -m pip install -r requirements-dev.lock

      - name: Verify historical release drift
        env:
          RELEASE_DRIFT_TRUST_ROOT_SHA256: ${{ inputs.release_drift_trust_root_sha256 }}
        run: >-
          python scripts/verify_release_drift.py
          --root .
          --expected-exceptions-sha256 "$RELEASE_DRIFT_TRUST_ROOT_SHA256"

      - name: Harden ephemeral runtime permissions
        run: python -m deployment_hardening harden-permissions --config config/runtime.demo.toml

      - name: Run synthetic-only test suite
        run: python -m pytest -q

  secret-scan:
    name: Repository secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Scan tracked files
        run: python scripts/secret_scan.py --root .
