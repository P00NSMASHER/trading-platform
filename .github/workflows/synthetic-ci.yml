name: synthetic-ci

# Hosted runner allocation is currently unavailable for this private repo.
# Keep the workflow staged/manual until Actions runner availability is restored.
on:
  workflow_dispatch:
    inputs:
      release_drift_trust_root_sha256:
        description: "Independently recorded SHA-256 of config/release_drift_allowlist.json"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: synthetic-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Synthetic-only tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install -r requirements-dev.lock

      - name: Verify historical release drift
        run: >-
          python scripts/verify_release_drift.py
          --root .
          --expected-exceptions-sha256 "${{ inputs.release_drift_trust_root_sha256 }}"

      - name: Run synthetic-only test suite
        run: python -m pytest -q

  secret-scan:
    name: Repository secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Scan tracked files
        run: python scripts/secret_scan.py --root .
