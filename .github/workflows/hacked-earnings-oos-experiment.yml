name: Hacked earnings out-of-time experiment

on:
  push:
    branches:
      - research/hacked-earnings-oos-experiment-20261006
    paths:
      - scripts/hacked_earnings_oos_experiment.py
      - .github/workflows/hacked-earnings-oos-experiment.yml

permissions:
  contents: read

concurrency:
  group: hacked-earnings-oos-experiment
  cancel-in-progress: false

jobs:
  experiment:
    if: github.ref == 'refs/heads/research/hacked-earnings-oos-experiment-20261006'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      PYTHONPATH: src:scripts
      NLTK_DATA: /tmp/hacked-earnings-nltk
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - name: Checkout exact research commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: \${{ github.sha }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked analytics runtime
        run: |
          python -m pip install --upgrade "pip==26.2.1"
          python -m pip install -r requirements.lock
          python -m pip install "nltk==3.9.1" "yfinance==1.7.0"
          python -m nltk.downloader -d "$NLTK_DATA" stopwords

      - name: Run deterministic unit checks
        run: python scripts/hacked_earnings_oos_experiment.py --self-test

      - name: Verify G1 exact-timestamp prerequisite
        run: |
          python - <<'PY'
          import pandas as pd
          p = "data/processed/authorized_input_real/announcement_resolutions.csv"
          d = pd.read_csv(p)
          assert len(d) == 174, len(d)
          assert d["resolution_status"].eq("resolved_exact_public_timestamp").all()
          assert d["public_announcement_ts"].notna().all()
          print("G1 exact timestamp prerequisite: 174/174")
          PY

      - name: Run earlier-only issuer-purged experiment
        run: |
          mkdir -p data/processed/hacked_earnings_oos
          python -m pip freeze > data/processed/hacked_earnings_oos/requirements-runtime.txt
          python scripts/hacked_earnings_oos_experiment.py
          cat data/processed/hacked_earnings_oos/REPORT.md >> "$GITHUB_STEP_SUMMARY"

      - name: Save derived research results only
        env:
          EXPECTED_HEAD: \${{ github.sha }}
          RESEARCH_BRANCH: research/hacked-earnings-oos-experiment-20261006
        run: |
          set -euo pipefail
          git fetch origin "$RESEARCH_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_HEAD"
          rm -f data/processed/hacked_earnings_oos/yahoo_daily_cache.csv.gz
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/processed/hacked_earnings_oos
          if ! git diff --cached --quiet; then
            git commit -m 'Record out-of-time hacked-earnings text experiment; no canonical coverage credit'
            git push origin "HEAD:refs/heads/$RESEARCH_BRANCH"
          fi

      - name: Preserve experiment artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hacked-earnings-oos-\${{ github.sha }}
          path: |
            data/processed/hacked_earnings_oos
            private_runtime/hacked_earnings_source
          if-no-files-found: warn
          retention-days: 1
