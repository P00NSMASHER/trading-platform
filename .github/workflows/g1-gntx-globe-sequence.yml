name: G1 GNTX GlobeNewswire sequence probe
on:
  push:
    branches: [g1/research-gntx-globe-sequence]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Probe migrated release IDs
        run: |
          python - <<'PY'
          import re, urllib.request
          ua={"User-Agent":"Mozilla/5.0 research@example.com"}
          for rid in range(930755,930766):
            urls=[
              f"https://www.globenewswire.com/news-release/2013/10/22/{rid}/0/en/x.html",
              f"https://www.globenewswire.com/mw/release.do?id={rid}&sourceType=3",
            ]
            for url in urls:
              try:
                req=urllib.request.Request(url,headers=ua)
                with urllib.request.urlopen(req,timeout=20) as r:
                  html=r.read().decode("utf-8","replace"); final=r.geturl()
                plain=re.sub(r"\s+"," ",re.sub(r"<[^>]+>"," ",html))
                title="Gentex Reports Third Quarter 2013 Financial Results"
                hit=title.lower() in plain.lower()
                clocks=re.findall(r"(?i)(?:October\s+22,\s+2013|Oct\.?\s+22,?\s+2013).{0,100}?([0-1]?\d:\d\d(?:\s*[AP]M)?\s*ET)",plain)
                meta=re.findall(r"(?i)(?:datePublished|article:published_time|publish(?:ed)?).{0,120}",html)
                print("RID",rid,"STATUS",200,"FINAL",final,"TARGET",hit,"CLOCKS",clocks[:10])
                if hit:
                  i=plain.lower().find(title.lower())
                  print("TARGET_CONTEXT",plain[max(0,i-500):i+800])
                  print("META",meta[:20])
              except Exception as e:
                print("RID",rid,"ERR",type(e).__name__,str(e)[:200],"URL",url)
          PY
