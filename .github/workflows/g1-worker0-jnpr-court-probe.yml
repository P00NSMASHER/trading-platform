name: G1 Worker 0 court-table shard scan

on:
  push:
    branches:
      - g1/research-worker0-jnpr-court-87ce85b

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Extract Worker-0 court-table rows
        shell: bash
        run: |
          set -euo pipefail
          url="https://storage.courtlistener.com/recap/gov.uscourts.nyed.373762/gov.uscourts.nyed.373762.367.2.pdf"
          curl --fail --location --retry 2 "$url" --output /tmp/court.pdf
          python -m pip install --disable-pip-version-check --quiet pypdf
          python - <<'PY'
          from pypdf import PdfReader
          import re

          targets = {
              "EHTH","BA","LSCC","GORO","GNTX","JNPR","PNRA","GMCR",
              "INWK","CLD","MIC","ILMN","CMP","NATI","SGEN","TW",
          }
          reader = PdfReader("/tmp/court.pdf")
          lines = []
          for page_no, page in enumerate(reader.pages, 1):
              text = page.extract_text() or ""
              for line in text.splitlines():
                  lines.append((page_no, line))

          row_re = re.compile(
              r"^\s*(?P<event>\d+)\s+(?P<symbol>[A-Z][A-Z0-9.-]*)\s+(?P<year>20\d{2})\s+"
          )
          hits = []
          for i, (page, line) in enumerate(lines):
              m = row_re.match(line)
              if not m or m.group("symbol") not in targets:
                  continue
              hits.append((i, page, m.group("symbol"), m.group("event"), line))

          print(f"PDF_PAGES={len(reader.pages)} TARGET_ROWS={len(hits)}")
          for i, page, symbol, event, line in hits:
              print(f"=== {symbol} COURT_EVENT={event} PAGE={page} LINE={i+1} ===")
              for j in range(i, min(len(lines), i + 5)):
                  p, value = lines[j]
                  print(f"P{p:03d} L{j+1:05d}: {value}")
          PY
