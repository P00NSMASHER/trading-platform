name: g1-public-batch-0052-worker-2

on:
  push:
    branches:
      - g1/public-batch--worker-2-0052-pay

permissions:
  contents: write

concurrency:
  group: g1-public-batch-0052-worker-2
  cancel-in-progress: false

jobs:
  generate-verify-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade "pip==26.2.1"
          python -m pip install -r requirements.lock
          python -m pip install -r requirements-dev.lock

      - name: Generate deterministic G1 batch
        run: python scripts/g1_batch_0052_generate.py

      - name: Remove temporary publisher from final tree
        run: |
          git rm --ignore-unmatch .github/workflows/g1-public-batch-0052-worker-2.yml
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("config/release_drift_allowlist.json")
          d=json.loads(p.read_text())
          key=".github/workflows/g1-public-batch-0052-worker-2.yml"
          for section in ("intentional_release_modifications","repository_additions"):
              d.get(section,{}).pop(key,None)
          p.write_text(json.dumps(d,indent=2,sort_keys=True)+"\n")
          PY
          git add config/release_drift_allowlist.json

      - name: Secret scan
        run: python scripts/secret_scan.py --root .

      - name: Receipt rebuild check
        run: python -m research_receipt_rebuild --root . --check

      - name: Focused G1 regression
        run: |
          python -m pytest -q tests/test_g1_public_batch_0052.py             tests/test_g1_source_research.py             tests/test_g1_acquisition_manifest.py             tests/test_real_data_release_sprint.py

      - name: Full pytest suite
        run: python -m pytest -q

      - name: Control-plane adversarial suite and audit pack
        run: |
          mkdir -p private_runtime/audit/control-plane-pack
          python -m pytest -q tests/test_control_plane_adversarial.py             --junitxml=private_runtime/audit/control-plane-pack/adversarial-junit.xml
          python scripts/control_plane_audit_pack.py             --root .             --junit-xml private_runtime/audit/control-plane-pack/adversarial-junit.xml             --output-dir private_runtime/audit/control-plane-pack             --expected-champion-sha256 0c8c16c9be734152c0018aa40e576fe4db9f4621359fafe521465890f9945616

      - name: Diff guard
        run: |
          git diff --cached --check
          git status --short

      - name: Commit generated final tree
        run: |
          git config user.name "g1-worker-2"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "G1 worker 2 batch 0052: recover PAY exact public clock"
          git push origin HEAD:${{ github.ref_name }}
