name: G1 GNTX search mirrors
on:
  push:
    branches: [g1/research-gntx-search-mirrors]
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Search public result mirrors
        run: |
          python - <<'PY'
          import urllib.request,urllib.parse,re,html
          qs=[
            '"Gentex Reports Third Quarter 2013 Financial Results" "AM ET"',
            '"Gentex Reports Third Quarter 2013 Financial Results" "Marketwire" time',
            '"Gentex Reports Third Quarter 2013 Financial Results" "08:"',
            '"Gentex Reports Third Quarter 2013 Financial Results" "8:00"',
            '"Gentex Reports Third Quarter 2013 Financial Results" "8:01"',
            '"Gentex Reports Third Quarter 2013 Financial Results" "8:02"',
            '"Gentex Reports Third Quarter 2013 Financial Results" "8:03"',
            '"Gentex Reports Third Quarter 2013 Financial Results" "8:04"',
            '"Gentex Reports Third Quarter 2013 Financial Results" "8:05"',
          ]
          ua={"User-Agent":"Mozilla/5.0"}
          for q in qs:
            print("\nQUERY",q)
            for engine,url in [
              ("DDG","https://html.duckduckgo.com/html/?q="+urllib.parse.quote(q)),
              ("BING","https://www.bing.com/search?q="+urllib.parse.quote(q)),
            ]:
              try:
                req=urllib.request.Request(url,headers=ua)
                txt=urllib.request.urlopen(req,timeout=20).read().decode("utf-8","replace")
                plain=html.unescape(re.sub(r"<[^>]+>"," ",txt))
                plain=re.sub(r"\s+"," ",plain)
                print(engine,"LEN",len(txt))
                for needle in ["Gentex Reports Third Quarter 2013 Financial Results","Marketwire","Marketwired"]:
                  pos=plain.lower().find(needle.lower())
                  if pos>=0: print(engine,"HIT",plain[max(0,pos-500):pos+1000])
              except Exception as e: print(engine,"ERR",repr(e))
          PY
