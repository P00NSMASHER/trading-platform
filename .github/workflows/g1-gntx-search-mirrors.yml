name: G1 GNTX search mirrors
on:
  push:
    branches: [g1/research-gntx-search-mirrors]
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Search indexed Marketwired URL
        run: |
          python - <<'PY'
          import urllib.request,urllib.parse,re,html,base64
          qs=[
            'site:marketwired.com/press-release/ Gentex "Third Quarter 2013 Financial Results" GNTX',
            'site:marketwired.com "Gentex Reports Third Quarter 2013 Financial Results"',
            '"Gentex Reports Third Quarter 2013 Financial Results" "marketwired.com/press-release"',
            '"Gentex Reports Third Quarter 2013 Financial Results" GNTX Marketwired',
          ]
          ua={"User-Agent":"Mozilla/5.0"}
          for q in qs:
            print("QUERY",q)
            url="https://www.bing.com/search?q="+urllib.parse.quote(q)+"&count=50"
            raw=urllib.request.urlopen(urllib.request.Request(url,headers=ua),timeout=20).read().decode("utf-8","replace")
            for block in re.findall(r'<li class="b_algo".*?</li>',raw,re.S):
              href=re.search(r'<h2[^>]*>.*?<a[^>]+href="([^"]+)"[^>]*>(.*?)</a>',block,re.S)
              cap=re.search(r'<p[^>]*>(.*?)</p>',block,re.S)
              if not href: continue
              title=html.unescape(re.sub(r"<[^>]+>"," ",href.group(2)))
              snip=html.unescape(re.sub(r"<[^>]+>"," ",cap.group(1) if cap else ""))
              print("RESULT",href.group(1),re.sub(r"\s+"," ",title),re.sub(r"\s+"," ",snip))
          PY
