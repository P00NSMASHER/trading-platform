name: G1 batch 0128 exact-main publisher

on:
  push:
    branches:
      - g1/source-0128-gntx-final-268c842
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: g1-batch-0128-final-exact-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      EXPECTED_BASE: 268c842b26a696a111f89b1c88b3e92eb227672b
    steps:
      - name: Checkout publisher source head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: g1/source-0128-gntx-final-268c842
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade "pip==26.2.1"
          python -m pip install -r requirements.lock
          python -m pip install -r requirements-dev.lock

      - name: Regenerate and validate exact controller main
        id: publish
        continue-on-error: true
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/g1-batch-0128-publisher.log") 2>&1
          WORKFLOW=".github/workflows/g1-public-batch-0128-final.yml"
          SCRIPT="scripts/g1_batch_0128_generate.py"
          SPEC="data/public/metadata/g1_public_batch_0128_integration_spec.json"
          PREP="data/public/metadata/g1_public_batch_0128_prep_evidence.json"
          FINAL_TEST="tests/test_g1_public_batch_0128.py"
          BATCH="data/public/metadata/g1_announcement_times_batch_0128.csv"

          git fetch origin main
          BASE="$(git rev-parse origin/main)"
          test "$BASE" = "$EXPECTED_BASE"
          git reset --hard "$BASE"
          git clean -fd

          for FILE in "$WORKFLOW" "$SCRIPT" "$SPEC" "$PREP" "$BATCH" "$FINAL_TEST"; do
            mkdir -p "$(dirname "$FILE")"
            git show "${SOURCE_SHA}:${FILE}" > "$FILE"
          done

          BASE="$BASE" python "$SCRIPT"

          pytest -q tests/test_g1_public_batch_0128.py tests/test_g1_source_research.py tests/test_g1_acquisition_manifest.py tests/test_metadata_resolver.py tests/test_real_data_release_sprint.py
          python -m deployment_hardening harden-permissions --config config/runtime.demo.toml
          pytest -q

          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE"

          rm -f "$WORKFLOW" "$SCRIPT" "$SPEC" "$PREP"
          git add -A
          test ! -e "$WORKFLOW"
          test ! -e "$SCRIPT"
          test ! -e "$SPEC"
          test ! -e "$PREP"

          if git diff --cached --name-only | grep -E '(^|/)(g1-public-batch-0128-final\.yml|g1_batch_0128_generate\.py|g1_public_batch_0128_integration_spec\.json|g1_public_batch_0128_prep_evidence\.json)$'; then
            echo "Temporary publisher material leaked into final tree."
            exit 1
          fi

          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("config/release_drift_allowlist.json")
          d=json.loads(p.read_text())
          forbidden={
            ".github/workflows/g1-public-batch-0128-final.yml",
            "scripts/g1_batch_0128_generate.py",
            "data/public/metadata/g1_public_batch_0128_integration_spec.json",
            "data/public/metadata/g1_public_batch_0128_prep_evidence.json",
            "tests/test_g1_public_batch_0128_prep.py",
          }
          for section in ("intentional_release_modifications","repository_additions"):
              for key in forbidden:
                  d.get(section,{}).pop(key,None)
          p.write_text(json.dumps(d,indent=2,sort_keys=True)+"\n")
          PY
          git add config/release_drift_allowlist.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "G1: recover GNTX exact GlobeNewswire clock, 174 exact / 0 excluded [g1-generated]"

          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE"
          OUT_BRANCH="g1/public-batch-0128-final-gntx-main-${BASE:0:7}-r${GITHUB_RUN_ID}"
          git push origin HEAD:"$OUT_BRANCH"
          echo "OUTPUT_BRANCH=$OUT_BRANCH" >> "$GITHUB_ENV"
          echo "OUTPUT_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "OUTPUT_BASE=$BASE" >> "$GITHUB_ENV"

      - name: Publish fail-closed diagnostic
        if: steps.publish.outcome == 'failure'
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git reset --hard "$SOURCE_SHA"
          git clean -fd
          mkdir -p data/public/metadata
          cp "$RUNNER_TEMP/g1-batch-0128-publisher.log" data/public/metadata/g1_public_batch_0128_publisher_failure.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/public/metadata/g1_public_batch_0128_publisher_failure.log
          git commit -m "G1: preserve final GNTX batch 0128 publisher failure diagnostic"
          git push --force origin HEAD:g1/diagnostic-batch-0128-final-gntx
          exit 1

      - name: Report exact output
        if: steps.publish.outcome == 'success'
        run: |
          echo "OUTPUT_BRANCH=${OUTPUT_BRANCH}"
          echo "OUTPUT_HEAD=${OUTPUT_HEAD}"
          echo "OUTPUT_BASE=${OUTPUT_BASE}"
