name: Hacked earnings G5 control stress

on:
  push:
    branches:
      - research/hacked-earnings-g5-control-stress-20261006
    paths:
      - scripts/hacked_earnings_g5_control_stress.py
      - .github/workflows/hacked-earnings-g5-control-stress.yml

permissions:
  contents: read

concurrency:
  group: hacked-earnings-g5-control-stress-20261006
  cancel-in-progress: false

jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      OUTPUT: /tmp/hacked-earnings-g5-control-stress
      RESEARCH_BRANCH: research/hacked-earnings-g5-control-stress-20261006
    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'

      - name: Install pinned analysis dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            'numpy==1.26.4' \
            'pandas==2.2.3' \
            'scipy==1.13.1'

      - name: Run G5 fail-closed and proxy sensitivity experiment
        run: |
          python scripts/hacked_earnings_g5_control_stress.py \
            --repo-root . \
            --output-dir "$OUTPUT"
          cat "$OUTPUT/REPORT.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Independent receipt assertions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("/tmp/hacked-earnings-g5-control-stress")
          s = json.loads((root / "summary.json").read_text())
          assert s["canonical_g5"]["model_evaluation_eligible_dates"] == 0
          assert s["canonical_g5"]["strict_g5_text_score_test_executed"] is False
          p = s["proxy_sensitivity"]
          assert p["controls_per_event"] == 3
          assert p["matched_control_rows"] == p["proxy_matchable_events"] * 3
          assert p["max_abs_smd_observed"] <= p["hard_abs_smd_limit"] + 1e-12
          assert p["proxy_matchable_events"] > 0
          print("Independent G5/proxy receipt assertions: PASS")
          PY

      - name: Save results to unchanged research branch
        run: |
          set -euo pipefail
          git fetch origin "$RESEARCH_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          mkdir -p data/processed/hacked_earnings_g5_control_stress
          cp -a "$OUTPUT/." data/processed/hacked_earnings_g5_control_stress/
          python -m pip freeze > data/processed/hacked_earnings_g5_control_stress/requirements-runtime.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/processed/hacked_earnings_g5_control_stress
          if ! git diff --cached --quiet; then
            git commit -m 'Record G5 control stress experiment results'
            git push origin "HEAD:refs/heads/$RESEARCH_BRANCH"
          fi

      - name: Preserve experiment artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hacked-earnings-g5-control-stress
          path: /tmp/hacked-earnings-g5-control-stress
          if-no-files-found: warn
          retention-days: 7
