name: G1 GNTX SEC public-time bound
on:
  push:
    branches: [g1/research-gntx-sec-bound]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Inspect SEC filing for original wire metadata
        run: |
          python - <<'PY'
          import urllib.request,re,html
          u="https://www.sec.gov/Archives/edgar/data/355811/000035581113000046/exhibit_991x093013.htm"
          req=urllib.request.Request(u,headers={"User-Agent":"G1 research contact research@example.com","Accept-Encoding":"identity"})
          txt=urllib.request.urlopen(req,timeout=20).read().decode("utf-8","replace")
          print("LEN",len(txt))
          for pat in [r'https?://[^"\'<> ]+',r'(?i).{0,200}(?:marketwire|marketwired|08:00|8:00|timestamp|publish|release).{0,300}']:
            vals=re.findall(pat,txt,re.S)
            print("PAT",pat)
            for v in vals[:100]: print("VAL",re.sub(r"\s+"," ",v)[:1000])
          PY
