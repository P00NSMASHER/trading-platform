name: G1 replication ZIP timestamp probe
on:
  push:
    branches:
      - g1/yahoo-sitemap-bulk-sweeper
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Probe ZIP metadata
        run: python scripts/g1_zip_mtime_probe.py
