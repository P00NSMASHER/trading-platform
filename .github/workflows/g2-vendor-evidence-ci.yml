name: g2-vendor-evidence-ci

on:
  push:
    branches:
      - main
    paths:
      - "src/g2_vendor_readiness.py"
      - "tests/test_g2_vendor_readiness.py"
      - "data/processed/g2_vendor_requests/vendor_readiness.json"
      - "data/processed/g2_vendor_requests/vendor_reply_evidence_2026-10-02.json"
      - "data/processed/g2_vendor_requests/vendor_request_summary.json"
      - "data/processed/g2_vendor_requests/vendor_activation_blueprint.json"
      - "data/processed/g2_vendor_requests/vendor_quote_packets.json"
      - "data/processed/g2_vendor_requests/cboe_trial_capacity_plan.json"
      - "data/processed/coverage_plan_real/coverage_summary.json"
      - ".github/workflows/g2-vendor-evidence-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "src/g2_vendor_readiness.py"
      - "tests/test_g2_vendor_readiness.py"
      - "data/processed/g2_vendor_requests/**"
      - "data/processed/coverage_plan_real/coverage_summary.json"
      - ".github/workflows/g2-vendor-evidence-ci.yml"

permissions:
  contents: read

jobs:
  readiness:
    name: G2 vendor evidence readiness
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONPATH: src

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install "pytest==9.0.2"

      - name: Run G2 vendor evidence regression
        run: python -m pytest -q tests/test_g2_vendor_readiness.py
