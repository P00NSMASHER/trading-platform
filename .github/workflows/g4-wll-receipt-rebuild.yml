name: g4-wll-receipt-rebuild

on:
  push:
    branches:
      - g4/wll-exact-rebased

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: g4/wll-exact-rebased
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade "pip==26.2.1"
          python -m pip install -r requirements.lock
          python -m pip install -r requirements-dev.lock
      - name: Rebuild coherent research receipts
        run: python -m research_receipt_rebuild --publish
      - name: Commit regenerated receipts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/authorized_input_real \
                  data/processed/real_data_replay/real_data_replay_status.json \
                  data/processed/research_receipt_bundle.json
          if git diff --cached --quiet; then
            echo "No receipt changes"
          else
            git commit -m "G4: regenerate receipts after WLL exact repair"
            git push origin HEAD:g4/wll-exact-rebased
          fi
