name: software-proof-replay

on:
  push:
    branches: [release/software-proof-replay]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: software-proof-replay
  cancel-in-progress: true

jobs:
  prove:
    if: "!contains(github.event.head_commit.message, '[software-proof-generated]')"
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade "pip==26.2.1"
          python -m pip install -r requirements.lock
          python -m pip install -r requirements-dev.lock

      - name: Harden ephemeral runtime
        run: |
          chmod 600 config/runtime.demo.toml
          chmod 600 data/processed/case_demo/cases.sqlite
          chmod 600 data/processed/model_demo/model_bundle.joblib
          chmod 600 data/processed/model_demo/training_manifest.json
          mkdir -p private_runtime/audit private_runtime/backups private_runtime/exports
          chmod 700 private_runtime/audit private_runtime/backups private_runtime/exports

      - name: Run fail-closed real-data replay proof
        run: |
          python src/real_data_replay.py             --config config/real_data_replay.software_proof.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("data/processed/real_data_replay/real_data_replay_status.json")
          s=json.loads(p.read_text())
          assert s["ready_for_non_synthetic_offline_evaluation"] is False
          assert s["evaluation_release_permitted"] is False
          assert s["stages"]["coverage"]["required_source_date_rows"] == 1656
          assert s["stages"]["coverage"]["covered_real_source_date_rows"] == 0
          assert s["stages"]["market_backfill"]["status"] == "BLOCKED_SYNTHETIC_SOURCE_PRESENT"
          assert s["stages"]["release"]["status"] == "DEPENDENCY_BLOCKED"
          print(json.dumps({
            "proof":"PASS",
            "coverage":s["stages"]["coverage"],
            "market_backfill":s["stages"]["market_backfill"]["status"],
            "release":s["stages"]["release"]["status"],
          },indent=2))
          PY

      - name: Re-certify software with replay proof present
        run: |
          python src/software_readiness_certification.py --require-software-ready
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("data/processed/software_readiness/software_readiness_certification.json")
          s=json.loads(p.read_text())
          assert s["software_ready"] is True
          assert s["real_data_validated"] is False
          assert s["overall_status"] == "SOFTWARE_READY_REAL_DATA_PENDING"
          assert s["real_data_state"]["replay_status_exists"] is True
          assert s["real_data_state"]["gates"]["REAL_DATA_REPLAY"] is False
          assert s["hostile_regression_suite"]["ok"] is True
          assert "tests/test_software_readiness_certification.py" in s["hostile_regression_suite"]["test_files"]
          print(json.dumps({
            "status":s["overall_status"],
            "hostile_tests":s["hostile_regression_suite"]["passed_count"],
            "replay_status_exists":s["real_data_state"]["replay_status_exists"],
          },indent=2))
          PY

      - name: Bind proof artifacts into release drift
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          p=Path("config/release_drift_allowlist.json")
          obj=json.loads(p.read_text(encoding="utf-8"))
          release_manifest=json.loads(Path("RELEASE_MANIFEST.json").read_text(encoding="utf-8"))
          release_paths={str(x["path"]) for x in release_manifest.get("files",[])}
          reason=(
            "Software-proof replay: execute the complete provider-agnostic replay with the synthetic example "
            "contract, prove it blocks real evaluation for the correct evidence reasons, and recertify software "
            "readiness with the replay status artifact present."
          )
          paths=[
            "config/real_data_replay.software_proof.json",
            "src/software_readiness_certification.py",
            "data/processed/real_data_replay/real_data_replay_status.json",
            "data/processed/software_readiness/software_readiness_certification.json",
          ]
          def sha(path):
              h=hashlib.sha256()
              with Path(path).open("rb") as f:
                  for chunk in iter(lambda:f.read(1024*1024),b""):
                      h.update(chunk)
              return h.hexdigest()

          mods=obj["intentional_release_modifications"]
          adds=obj["repository_additions"]
          for path in paths:
              detail={"expected_sha256":sha(path),"reason":reason}
              mods.pop(path,None); adds.pop(path,None)
              if path in release_paths:
                  mods[path]=detail
              else:
                  adds[path]=detail
          p.write_text(json.dumps(obj,indent=2)+"\n",encoding="utf-8")
          PY

      - name: Commit proof receipts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             config/release_drift_allowlist.json             data/processed/real_data_replay/real_data_replay_status.json             data/processed/software_readiness/software_readiness_certification.json
          git commit -m "[software-proof-generated] bind replay proof and recertify"
          git push origin HEAD:release/software-proof-replay
