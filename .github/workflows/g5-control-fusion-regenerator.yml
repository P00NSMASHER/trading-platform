name: g5-control-fusion-regenerator

on:
  push:
    branches:
      - g5/fuse-point-in-time-control-metadata
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout producer branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: g5/fuse-point-in-time-control-metadata

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade "pip==26.2.1"
          python -m pip install -r requirements.lock
          python -m pip install -r requirements-dev.lock

      - name: Verify focused G5 fusion coverage
        run: python -m pytest -q tests/test_metadata_resolver.py

      - name: Rebuild deterministic research receipts
        run: |
          python -m research_receipt_rebuild --publish
          python -m research_receipt_rebuild --check

      - name: Regenerate truthful sprint status
        run: |
          python -m real_data_release_sprint status \
            --requirements-manifest data/processed/real_data_release_sprint/requirements_manifest.json \
            --coverage-summary data/processed/coverage_plan_real/coverage_summary.json \
            --metadata-readiness data/processed/authorized_input_real/metadata_readiness_summary.json \
            --metadata-quality data/processed/authorized_input_real/metadata_quality_summary.json \
            --out data/processed/real_data_release_sprint/step_status.json

      - name: Refresh reviewed drift identities
        run: |
          python - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path

          allow = Path("config/release_drift_allowlist.json")
          obj = json.loads(allow.read_text(encoding="utf-8"))
          reason = (
              "G5 multi-source point-in-time control metadata fusion: combine latest pre-cutoff "
              "covariates across authorized sources while failing closed on undated rows and "
              "equal-timestamp conflicts; genuine G5 remains blocked until real evidence exists."
          )
          explicit = {
              "src/metadata_resolver.py",
              "tests/test_metadata_resolver.py",
          }
          changed = set(
              subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          )
          for path in sorted(explicit | changed):
              p = Path(path)
              if not p.is_file() or path == "config/release_drift_allowlist.json":
                  continue
              digest = hashlib.sha256(p.read_bytes()).hexdigest()
              if path in obj.get("intentional_release_modifications", {}):
                  entry = obj["intentional_release_modifications"][path]
              elif path in obj.get("repository_additions", {}):
                  entry = obj["repository_additions"][path]
              else:
                  raise SystemExit(f"reviewed drift entry missing for changed path: {path}")
              entry["expected_sha256"] = digest
              entry["reason"] = reason
          allow.write_text(json.dumps(obj, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Remove one-shot workflow and run full exact-tree tests
        run: |
          git rm .github/workflows/g5-control-fusion-regenerator.yml
          python -m pytest -q

      - name: Commit regenerated receipts and trust identities
        run: |
          git add \
            config/release_drift_allowlist.json \
            data/processed/authorized_input_real \
            data/processed/real_data_replay/real_data_replay_status.json \
            data/processed/research_receipt_bundle.json \
            data/processed/real_data_release_sprint/step_status.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate G5 fusion receipts"
          git push origin HEAD:g5/fuse-point-in-time-control-metadata
