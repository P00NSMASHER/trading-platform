name: CREE ownership hash probe
on:
  push:
    branches:
      - g1/assign-cree-residual-worker2
permissions:
  contents: read
jobs:
  hash:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: sha256sum data/public/metadata/g1_swarm_controller_policy.json tests/test_g1_swarm_controller.py
