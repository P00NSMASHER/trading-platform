name: g4-complete-reviewed-exclusions

on:
  push:
    branches: [fix/g4-complete-reviewed-exclusions]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: g4-complete-reviewed-exclusions
  cancel-in-progress: true

jobs:
  complete:
    if: "!contains(github.event.head_commit.message, '[g4-reviewed-exclusions-generated]')"
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade "pip==26.2.1"
          python -m pip install -r requirements.lock
          python -m pip install -r requirements-dev.lock

      - name: Rebuild canonical metadata
        run: |
          python -m metadata_resolver \
            --events data/processed/historical_events.csv \
            --symbol-dates data/processed/coverage_plan_real/symbol_date_requirements.csv \
            --contract config/metadata_sources.public_progress.json \
            --outdir data/processed/authorized_input_real
          python -m metadata_quality \
            --events data/processed/historical_events.csv \
            --symbol-dates data/processed/coverage_plan_real/symbol_date_requirements.csv \
            --contract config/metadata_sources.public_progress.json \
            --resolver-dir data/processed/authorized_input_real \
            --outdir data/processed/authorized_input_real

      - name: Assert G4 complete with fail-closed exclusions
        run: |
          python - <<'PY'
          import csv, json
          from collections import Counter
          from pathlib import Path

          out=Path("data/processed/authorized_input_real")
          ready=json.loads((out/"metadata_readiness_summary.json").read_text())
          assert ready["shares_symbol_dates_resolved"] == 3810, ready
          assert ready["shares_symbol_dates_excluded"] == 18, ready
          assert ready["shares_symbol_dates_accounted_for"] == 3828, ready
          assert ready["shares_symbol_dates_unresolved"] == 0, ready
          assert ready["ready_g4_shares_outstanding"] is True, ready
          assert ready["shares_exclusion_receipt"]["applied_count"] == 18, ready
          # G4 completion must not falsely unlock unrelated missing gates.
          assert ready["ready_g1_announcement_times"] is False
          assert ready["ready_g5_matched_control_universe"] is False
          assert ready["ready_for_step15_real_backfill_metadata"] is False
          assert ready["ready_for_non_synthetic_model_evaluation_metadata"] is False

          rows=list(csv.DictReader((out/"shares_outstanding_resolutions.csv").open(newline="",encoding="utf-8")))
          excluded=[r for r in rows if r["resolution_status"]=="excluded_fail_closed"]
          assert len(excluded)==18, len(excluded)
          counts=Counter(r["historical_symbol"] for r in excluded)
          assert counts == Counter({"ACO":10,"CGNX":5,"WLL":3}), counts
          for r in excluded:
              assert r["shares_outstanding"] == "", r
              assert r["fact_date"] == "", r
              assert r["available_at"] == "", r
              assert r["staleness_days"] == "", r

          gates=list(csv.DictReader((out/"metadata_unresolved_gates.csv").open(newline="",encoding="utf-8")))
          g4=next(r for r in gates if r["gate_id"]=="G4_SHARES_OUTSTANDING")
          assert g4["status"]=="READY_WITH_REVIEWED_EXCLUSIONS", g4
          assert int(g4["resolved"])==3810 and int(g4["excluded"])==18 and int(g4["accounted_for"])==3828, g4

          domains=list(csv.DictReader((out/"metadata_domain_quality.csv").open(newline="",encoding="utf-8")))
          shares=next(r for r in domains if r["domain"]=="shares")
          assert shares["status"]=="READY_WITH_REVIEWED_EXCLUSIONS", shares
          assert int(shares["resolver_ready_count"])==3810, shares
          assert int(shares["quality_clear_count"])==3810, shares
          assert int(shares["reviewed_exclusion_count"])==18, shares
          assert int(shares["quarantined_count"])==0, shares

          quality=json.loads((out/"metadata_quality_summary.json").read_text())
          assert quality["reviewed_share_exclusion_count"]==18, quality
          assert quality["status"]=="BLOCKED", quality
          print(json.dumps({"G4":"COMPLETE_WITH_REVIEWED_EXCLUSIONS","resolved":3810,"excluded":18,"accounted":3828,"remaining_blocking":0},indent=2))
          PY

      - name: Focused tests
        run: |
          python -m pytest -q tests/test_metadata_resolver.py tests/test_metadata_quality.py

      - name: Update reviewed release-drift hashes
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          p=Path("config/release_drift_allowlist.json")
          obj=json.loads(p.read_text(encoding="utf-8"))
          reason="G4 completion: 3,810 exact point-in-time shares resolutions plus 18 immutable reviewed fail-closed exclusions account for all 3,828 required symbol-dates without fabricating shares or allowing excluded-row turnover."
          paths=[
            "src/metadata_resolver.py",
            "src/metadata_quality.py",
            "tests/test_metadata_resolver.py",
            "tests/test_metadata_quality.py",
            "config/metadata_sources.public_progress.json",
            "data/processed/authorized_input_real/metadata_readiness_summary.json",
            "data/processed/authorized_input_real/metadata_unresolved_gates.csv",
            "data/processed/authorized_input_real/shares_outstanding_resolutions.csv",
            "data/processed/authorized_input_real/metadata_quality_summary.json",
            "data/processed/authorized_input_real/metadata_domain_quality.csv",
          ]
          def sha(path):
              h=hashlib.sha256()
              with Path(path).open("rb") as f:
                  for chunk in iter(lambda:f.read(1024*1024),b""):
                      h.update(chunk)
              return h.hexdigest()
          mods=obj["intentional_release_modifications"]
          adds=obj["repository_additions"]
          for path in paths:
              detail={"expected_sha256":sha(path),"reason":reason}
              if path in mods:
                  mods[path]=detail
              else:
                  adds[path]=detail
          p.write_text(json.dumps(obj,indent=2)+"\n",encoding="utf-8")
          PY

      - name: Commit G4 completion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            config/release_drift_allowlist.json \
            data/processed/authorized_input_real
          git commit -m "[g4-reviewed-exclusions-generated] complete G4 fail-closed"
          git push origin HEAD:fix/g4-complete-reviewed-exclusions
