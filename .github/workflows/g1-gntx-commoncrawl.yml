name: G1 GNTX Common Crawl research
on:
  push:
    branches: [g1/research-gntx-commoncrawl]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Query 2013 Common Crawl indexes
        run: |
          python - <<'PY'
          import urllib.request,urllib.parse,json,re,gzip,io
          ua={"User-Agent":"G1-public-research/1.0"}
          def get(url,timeout=20,headers=None):
            h=dict(ua); h.update(headers or {})
            req=urllib.request.Request(url,headers=h)
            with urllib.request.urlopen(req,timeout=timeout) as r:return r.read()
          cols=json.loads(get("https://index.commoncrawl.org/collinfo.json"))
          ids=[x["id"] for x in cols if "2013" in x["id"]]
          print("INDEXES",ids)
          patterns=[
            "www.marketwired.com/press-release/gentex-",
            "marketwired.com/press-release/gentex-",
            "www.marketwire.com/press-release/gentex-",
            "marketwire.com/press-release/gentex-",
          ]
          records=[]
          for idx in ids:
            for pat in patterns:
              q=f"https://index.commoncrawl.org/{idx}-index?"+urllib.parse.urlencode({"url":pat,"matchType":"prefix","output":"json","filter":"status:200"})
              try:
                txt=get(q,15).decode("utf-8","replace")
              except Exception as e:
                print("INDEX_ERR",idx,pat,repr(e));continue
              for line in txt.splitlines():
                try:r=json.loads(line)
                except:continue
                u=r.get("url","").lower()
                if "gentex" in u:
                  records.append((idx,r))
                  print("RECORD",idx,r.get("timestamp"),r.get("url"),r.get("filename"),r.get("offset"),r.get("length"))
          print("RECORD_COUNT",len(records))
          for idx,r in records:
            if not ("201310" in str(r.get("timestamp","")) or "third-quarter" in r.get("url","").lower() or "third_quarter" in r.get("url","").lower()): continue
            try:
              off=int(r["offset"]); ln=int(r["length"])
              data=get("https://data.commoncrawl.org/"+r["filename"],30,{"Range":f"bytes={off}-{off+ln-1}"})
              try:data=gzip.decompress(data)
              except:pass
              txt=data.decode("utf-8","replace")
              print("WARC_URL",r["url"])
              for pat in [r'(?i)\b\d{1,2}:\d{2}(?::\d{2})?\s*(?:AM|PM)\s*(?:ET|EDT|EST)',r'(?i)October 22, 2013.{0,120}']:
                print("WARC_MATCH",re.findall(pat,txt)[:30])
              pos=txt.lower().find("gentex reports third quarter 2013 financial results")
              if pos>=0: print("WARC_CONTEXT",re.sub(r"\s+"," ",txt[max(0,pos-1000):pos+2000]))
            except Exception as e: print("WARC_ERR",repr(e))
          PY
