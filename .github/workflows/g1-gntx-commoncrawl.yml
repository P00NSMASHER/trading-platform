name: G1 GNTX Common Crawl research
on:
  push:
    branches: [g1/research-gntx-commoncrawl]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Exact wildcard query
        run: |
          set -euo pipefail
          for IDX in CC-MAIN-2013-48 CC-MAIN-2013-20; do
            for Q in \
              'www.marketwired.com/press-release/gentex-reports-third-quarter-2013-financial-results*' \
              'www.marketwired.com/press-release/gentex-reports-third-quarter-2013*' \
              'www.marketwired.com/press-release/gentex-reports-third-quarter-financial-results*'; do
              echo "QUERY $IDX $Q"
              curl -L --max-time 12 --retry 1 --fail --get \
                --data-urlencode "url=$Q" --data-urlencode "output=json" \
                "https://index.commoncrawl.org/$IDX-index" || true
            done
          done
