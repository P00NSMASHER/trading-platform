name: G1 GNTX Common Crawl research
on:
  push:
    branches: [g1/research-gntx-commoncrawl]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Query exact 2013 Marketwired GNTX release
        run: |
          python - <<'PY'
          import urllib.request,urllib.parse,json,re,gzip,html
          ua={"User-Agent":"G1-public-research/1.0"}
          def get(url,timeout=20,headers=None):
            h=dict(ua);h.update(headers or {})
            req=urllib.request.Request(url,headers=h)
            with urllib.request.urlopen(req,timeout=timeout) as r:return r.read()
          cols=json.loads(get("https://index.commoncrawl.org/collinfo.json"))
          ids=[x["id"] for x in cols if "2013" in x["id"]]
          prefixes=[
            "www.marketwired.com/press-release/gentex-reports-third-quarter-2013-financial-results",
            "www.marketwired.com/press-release/gentex-reports-third-quarter-2013",
            "www.marketwired.com/press-release/gentex-reports-third-quarter-financial-results",
            "www.marketwired.com/press-release/gentex-corporation-announces-third-quarter-2013-financial-results",
          ]
          rec=[]
          for idx in ids:
            for prefix in prefixes:
              q=f"https://index.commoncrawl.org/{idx}-index?"+urllib.parse.urlencode({"url":prefix,"matchType":"prefix","output":"json"})
              try: txt=get(q,20).decode("utf-8","replace")
              except Exception as e: print("ERR",idx,prefix,repr(e));continue
              for line in txt.splitlines():
                try:r=json.loads(line)
                except:continue
                print("REC",idx,r.get("timestamp"),r.get("url"),r.get("filename"),r.get("offset"),r.get("length"))
                rec.append(r)
          seen=set()
          for r in rec:
            k=(r.get("filename"),r.get("offset")); 
            if k in seen: continue
            seen.add(k)
            try:
              off=int(r["offset"]);ln=int(r["length"])
              data=get("https://data.commoncrawl.org/"+r["filename"],30,{"Range":f"bytes={off}-{off+ln-1}"})
              try:data=gzip.decompress(data)
              except:pass
              txt=data.decode("utf-8","replace")
              plain=html.unescape(re.sub(r"<[^>]+>"," ",txt));plain=re.sub(r"\s+"," ",plain)
              print("URL",r.get("url"))
              print("CLOCKS",re.findall(r'(?i)\b\d{1,2}:\d{2}(?::\d{2})?\s*(?:AM|PM)\s*(?:ET|EDT|EST)',plain)[:50])
              for needle in ["Gentex Reports Third Quarter 2013 Financial Results","Oct 22, 2013","October 22, 2013"]:
                i=plain.lower().find(needle.lower())
                if i>=0: print("CTX",needle,plain[max(0,i-1000):i+2000])
            except Exception as e: print("WARC_ERR",repr(e))
          PY
