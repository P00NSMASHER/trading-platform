name: g4-shares-batch-0001

on:
  push:
    branches:
      - fix/g4-shares-batch-0001
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: g4-shares-batch-0001
  cancel-in-progress: true

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[g4-batch-0001-generated]')"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: src

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Materialize G4 observations 1-500 from frozen SEC anchors
        run: |
          python -m g4_materialize_batch \
            --requirements data/processed/coverage_plan_real/symbol_date_requirements.csv \
            --anchors data/public/metadata/g4_shares_anchors_batch_0001.csv \
            --start 0 \
            --count 500 \
            --output data/public/metadata/g4_shares_batch_0001.csv \
            --report data/processed/authorized_input_real/g4_shares_batch_0001_report.json

      - name: Print and require full 500-observation resolution
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("data/processed/authorized_input_real/g4_shares_batch_0001_report.json")
          r=json.loads(p.read_text())
          print(json.dumps(r, indent=2, sort_keys=True))
          assert r["batch_count"] == 500
          assert r["resolved_count"] == 500, r
          assert r["unresolved_count"] == 0, r
          PY

      - name: Rebuild canonical metadata readiness
        run: |
          python -m metadata_resolver \
            --events data/processed/historical_events.csv \
            --symbol-dates data/processed/coverage_plan_real/symbol_date_requirements.csv \
            --contract config/metadata_sources.public_progress.json \
            --outdir data/processed/authorized_input_real

          python -m metadata_quality \
            --events data/processed/historical_events.csv \
            --symbol-dates data/processed/coverage_plan_real/symbol_date_requirements.csv \
            --contract config/metadata_sources.public_progress.json \
            --resolver-dir data/processed/authorized_input_real \
            --outdir data/processed/authorized_input_real

      - name: Assert G3 preserved and exactly 500 G4 observations resolved
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("data/processed/authorized_input_real/metadata_readiness_summary.json").read_text())
          assert r["event_exchange_resolved"] == 174
          assert r["ready_g3_primary_listing_history"] is True
          assert r["shares_symbol_dates_resolved"] == 500, r
          assert r["shares_symbol_dates_unresolved"] == 3328, r
          assert r["ready_g4_shares_outstanding"] is False
          assert r["ready_g1_announcement_times"] is False
          assert r["ready_g5_matched_control_universe"] is False
          print(json.dumps({
            "G3": r["ready_g3_primary_listing_history"],
            "G4_resolved": r["shares_symbol_dates_resolved"],
            "G4_remaining": r["shares_symbol_dates_unresolved"],
          }, indent=2))
          PY

      - name: Run focused G4 tests
        run: |
          python -m pytest -q \
            tests/test_g4_sec_shares_batch.py \
            tests/test_metadata_resolver.py \
            tests/test_metadata_quality.py

      - name: Commit batch evidence and canonical receipts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/public/metadata/g4_shares_batch_0001.csv \
            data/processed/authorized_input_real/g4_shares_batch_0001_report.json \
            data/processed/authorized_input_real/announcement_resolutions.csv \
            data/processed/authorized_input_real/control_universe_readiness.csv \
            data/processed/authorized_input_real/event_exchange_resolutions.csv \
            data/processed/authorized_input_real/metadata_domain_quality.csv \
            data/processed/authorized_input_real/metadata_quality_gate.csv \
            data/processed/authorized_input_real/metadata_quality_issues.csv \
            data/processed/authorized_input_real/metadata_quality_summary.json \
            data/processed/authorized_input_real/metadata_quarantine.csv \
            data/processed/authorized_input_real/metadata_readiness_summary.json \
            data/processed/authorized_input_real/metadata_source_inventory.json \
            data/processed/authorized_input_real/metadata_unresolved_gates.csv \
            data/processed/authorized_input_real/shares_outstanding_resolutions.csv
          git commit -m "[g4-batch-0001-generated] resolve observations 1-500"
          git push origin HEAD:fix/g4-shares-batch-0001
